---
apiVersion: kubeopencode.io/v1alpha1
kind: CronTask
metadata:
  name: cncf-weekly-research-hourly
  namespace: kubeopencode
  labels:
    app.kubernetes.io/part-of: cncf-landscape-a-to-z
    app.kubernetes.io/component: crontask
spec:
  # Runs hourly at minute 23 to avoid peak cron collision
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  maxRetainedTasks: 10
  taskTemplate:
    spec:
      agentRef:
        name: cncf-landscape-agent
      description: |
        Perform autonomous weekly CNCF Landscape project research:
        1. Draw a task from the weighted roulette / ad-hoc queue:
           just draw
        2. Conduct in-depth research according to `.agents/skills/cncf-weekly-content/SKILL.md`.
        3. Write structured research YAML under `data/weeks/<week_id>/research/<project_name>.yaml`.
        4. Validate data contracts:
           just validate
        5. Verify unit tests pass:
           just test
        6. Commit changes and push or open a pull request.

---
apiVersion: kubeopencode.io/v1alpha1
kind: CronTask
metadata:
  name: cncf-compass-improvement-weekly
  namespace: kubeopencode
  labels:
    app.kubernetes.io/part-of: cncf-landscape-a-to-z
    app.kubernetes.io/component: crontask
spec:
  # Runs weekly on Tuesdays at 09:00 UTC
  schedule: "0 9 * * 2"
  concurrencyPolicy: Forbid
  maxRetainedTasks: 5
  taskTemplate:
    spec:
      agentRef:
        name: cncf-landscape-agent
      description: |
        Conduct weekly Compass alignment and backlog review for CNCF Landscape A-to-Z:
        1. Inspect `data/tracker.yaml` across current and upcoming weekly letters.
        2. Identify unresearched or missing CNCF projects and categories.
        3. Audit category index entries (`data/index/`) for consistency.
        4. Consult content domain memory at `docs/domain-memory/content.md`.

---
apiVersion: kubeopencode.io/v1alpha1
kind: CronTask
metadata:
  name: cncf-palette-improvement-weekly
  namespace: kubeopencode
  labels:
    app.kubernetes.io/part-of: cncf-landscape-a-to-z
    app.kubernetes.io/component: crontask
spec:
  # Runs weekly on Thursdays at 09:00 UTC
  schedule: "0 9 * * 4"
  concurrencyPolicy: Forbid
  maxRetainedTasks: 5
  taskTemplate:
    spec:
      agentRef:
        name: cncf-landscape-agent
      description: |
        Conduct weekly UI, UX, and accessibility maintenance for the Hugo website theme:
        1. Review `website/themes/cncf-theme/` layouts and partials.
        2. Verify keyboard navigation, tabindex on `<main>`, focus-visible styles on buttons, and semantic `<a>` tags.
        3. Consult UI domain memory at `docs/domain-memory/palette.md`.
        4. Run end-to-end frontend tests:
           just e2e

---
apiVersion: kubeopencode.io/v1alpha1
kind: CronTask
metadata:
  name: cncf-engineering-improvement-weekly
  namespace: kubeopencode
  labels:
    app.kubernetes.io/part-of: cncf-landscape-a-to-z
    app.kubernetes.io/component: crontask
spec:
  # Runs weekly on Saturdays at 09:00 UTC
  schedule: "0 9 * * 6"
  concurrencyPolicy: Forbid
  maxRetainedTasks: 5
  taskTemplate:
    spec:
      agentRef:
        name: cncf-landscape-agent
      description: |
        Conduct weekly codebase engineering, test suite, and schema maintenance:
        1. Run the test suite:
           just test
        2. Check Pydantic schemas in `src/agentic/models.py` and data pipeline validators.
        3. Consult engineering domain memory at `docs/domain-memory/engineering.md`.
