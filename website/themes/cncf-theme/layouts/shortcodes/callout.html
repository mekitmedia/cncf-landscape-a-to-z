{{ $title := .Get "title" | default "Notice" }}
{{ $type := .Get "type" | default "info" }}

<div class="my-6 p-6 bg-slate-50 border border-slate-200 rounded-2xl shadow-sm">
    <h3 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
        {{ if eq $type "code" }}
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 00-2 2z"></path></svg>
        {{ else }}
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {{ end }}
        {{ $title }}
    </h3>
    <div class="text-slate-700 leading-relaxed text-sm md:text-base">
        {{ .Inner | .Page.RenderString }}
    </div>
</div>
