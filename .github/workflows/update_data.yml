name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - '.github/workflows/update_data.yml'
      - 'justfile'

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install
    
    - name: Install just
      uses: extractions/setup-just@v2
    
    - name: Install dependencies
      run: just install
    
    - name: Run tests
      run: just test

  update-data:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install
    
    - name: Install just
      uses: extractions/setup-just@v2

    - name: Install dependencies
      run: just install

    - name: Run ETL
      run: just etl

    - name: Build workflow summary
      id: data-summary
      run: |
        if git diff --quiet -- data/ website/content/letters/; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "## Data update summary" >> "$GITHUB_STEP_SUMMARY"
          echo "No data or letter changes were detected." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "has_changes=true" >> "$GITHUB_OUTPUT"
        echo "## Data update summary" >> "$GITHUB_STEP_SUMMARY"
        echo "### Changed files" >> "$GITHUB_STEP_SUMMARY"
        git diff --name-status -- data/ website/content/letters/ >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Change stats" >> "$GITHUB_STEP_SUMMARY"
        git diff --stat -- data/ website/content/letters/ >> "$GITHUB_STEP_SUMMARY"

    - name: Create Pull Request
      if: steps.data-summary.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "ci: Update data (scheduled)"
        title: "Scheduled Data Update"
        body: |
          Weekly data update generated by GitHub Actions.

          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: `${{ github.event_name }}`
        branch: "data-update-automated"
        base: "main"
        add-paths: |
          data
          website/content/letters
        delete-branch: true
