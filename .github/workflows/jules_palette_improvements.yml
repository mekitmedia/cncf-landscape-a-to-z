name: Scheduled Jules Palette Improvement

on:
  schedule:
    # Run weekly on Thursdays at 09:00 UTC
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-palette-improvement
  cancel-in-progress: false

jobs:
  jules-palette:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Palette Prompt
        id: prompt
        shell: bash
        run: |
          delimiter="EOF_$(uuidgen | tr '[:upper:]' '[:lower:]')"
          {
            echo "prompt<<${delimiter}"
            cat .github/prompts/palette_prompt.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Jules Action
        uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
