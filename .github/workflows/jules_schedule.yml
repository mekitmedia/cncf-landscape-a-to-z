name: Scheduled Jules Content Task

on:
  schedule:
    # Run twice daily (00:00 UTC and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'Optional custom override prompt for Jules'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jules-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Jules Prompt
        id: load-prompt
        env:
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          EOF="EOF_$(date +%s%N)"
          echo "PROMPT<<$EOF" >> "$GITHUB_ENV"
          if [ -n "$CUSTOM_PROMPT" ]; then
            echo "$CUSTOM_PROMPT" >> "$GITHUB_ENV"
          else
            cat .github/prompts/jules_prompt.md >> "$GITHUB_ENV"
          fi
          echo "$EOF" >> "$GITHUB_ENV"

      - name: Run Jules Action
        uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: ${{ env.PROMPT }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
