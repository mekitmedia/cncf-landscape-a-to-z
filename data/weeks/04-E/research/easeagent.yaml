summary: EaseAgent is a lightweight, non-intrusive Java agent tailored for cloud-native
  APM and distributed tracing.
key_features:
- Non-intrusive bytecode instrumentation for Java microservices.
- Standardized metrics collection compatible with Prometheus and OpenTelemetry.
- Distributed tracing integration with Zipkin and Jaeger protocols.
recent_updates: Enhanced Spring Cloud integration and reduced agent memory overhead
  in containerized runtimes.
use_cases: Extracting runtime performance metrics and distributed traces from Java
  microservices without code modifications.
