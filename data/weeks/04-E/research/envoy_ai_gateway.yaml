summary: Envoy-ai-gateway (Agent Router) is an Envoy-native gateway providing unified,
  OpenAI-compatible APIs, routing, and governance for LLM inference and tools.
key_features:
- Unified OpenAI-compatible endpoint bridging public LLM APIs, self-hosted models,
  and MCP tools.
- Centralized quota management, token rate limiting, and prompt caching enforced by
  Envoy.
- Model routing with automated fallback, failover, and cost attribution.
recent_updates: Expanded support for Anthropic and vLLM backends, streaming token
  metrics, and Model Context Protocol (MCP) server routing.
use_cases: Serving as an enterprise AI gateway managing LLM credentials, caching,
  and inference traffic across teams.
