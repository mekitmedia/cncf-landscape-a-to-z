summary: Eraser is a CNCF Sandbox tool that automates the cleanup and removal of unused,
  non-running container images across Kubernetes nodes.
key_features:
- Automated removal of non-running and vulnerable container images from all nodes.
- Pattern-matching exclusions protecting essential daemonsets and infrastructure images.
- Scheduled CronJob cleanup reducing node disk pressure and container registry pull
  quotas.
recent_updates: Added container vulnerability scanner integration and refined containerd/CRI-O
  image deletion hooks.
use_cases: Preventing Kubernetes worker node disk exhaustion and eliminating stale
  vulnerable images automatically.
