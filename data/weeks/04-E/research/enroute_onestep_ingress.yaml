summary: EnRoute OneStep Ingress is a streamlined, Envoy-powered Kubernetes ingress
  controller and API gateway with one-click setup.
key_features:
- Simple single-command Helm deployment for exposing Kubernetes services.
- Declarative L7 policies for rate limiting, JWT verification, and traffic shaping.
- Automated SSL/TLS certificate lifecycle management via ACME and Let's Encrypt.
