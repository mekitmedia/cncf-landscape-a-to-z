summary: Epsilla is an open-source vector database engineered for scalability, low
  latency, and cost-effective similarity search in GenAI applications.
key_features:
- State-of-the-art graph indexing providing 10x query throughput improvements.
- Bridges information retrieval and persistent memory retention for LLM applications.
- Scalable cloud-native architecture deployable locally via Docker or in Kubernetes.
