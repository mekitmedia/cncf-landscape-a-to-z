summary: EMQX is an ultra-scalable, distributed MQTT message broker designed for IoT,
  industrial automation, and connected vehicle fleets.
key_features:
- Massive scalability supporting up to 100M concurrent MQTT connections.
- Sub-millisecond latency with Erlang/OTP actor model concurrency.
- Built-in SQL-based rule engine routing messages directly to databases and cloud
  streams.
recent_updates: Recent versions introduced unified multi-protocol gateways and native
  Apache Kafka and Iceberg data streaming bridges.
use_cases: Connecting hyper-scale IoT devices, automotive telematics, and real-time
  edge messaging.
