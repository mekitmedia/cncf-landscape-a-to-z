summary: Envoy is a CNCF Graduated, high-performance C++ edge, middle, and service
  proxy designed for cloud-native microservices.
key_features:
- Non-blocking, event-driven architecture with low memory footprint and high throughput.
- Dynamic configuration via Discovery Services APIs (xDS) without restarting processes.
- Advanced L7 load balancing, circuit breaking, observability, and distributed tracing.
recent_updates: Continuous enterprise hardening, enhanced HTTP/3 support, and deeper
  WebAssembly filter integration.
use_cases: Serving as the foundational data plane for service meshes (Istio, Linkerd),
  API gateways, and edge ingresses.
