summary: Emissary-Ingress is a CNCF Incubating, open-source Kubernetes-native API
  gateway and ingress controller built on Envoy Proxy.
key_features:
- Self-service routing and declarative configuration via Kubernetes CRDs.
- Full L7 protocol support including gRPC, HTTP/2, WebSockets, and TCP.
- Integrated rate limiting, OAuth/OIDC authentication, and distributed tracing.
recent_updates: Enhanced Kubernetes Gateway API conformance and updated underlying
  Envoy runtime to latest stable branches.
use_cases: Serving as the primary edge ingress router and API gateway for production
  Kubernetes clusters.
