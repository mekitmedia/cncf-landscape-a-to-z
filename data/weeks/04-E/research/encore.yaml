summary: Encore is an open-source backend development engine and infrastructure SDK
  that automates cloud provisioning directly from code.
key_features:
- Type-safe infrastructure primitives (databases, pub/sub, cron jobs) declared directly
  in Go/TypeScript code.
- Automatic architecture parsing and automated provisioning on AWS and GCP.
- Built-in local development environment with distributed tracing and architecture
  visualization.
recent_updates: Added native AI coding agent integrations and expanded multi-cloud
  microservice orchestration capabilities.
use_cases: Accelerating cloud-native backend development without writing Terraform
  or boilerplate infrastructure configs.
