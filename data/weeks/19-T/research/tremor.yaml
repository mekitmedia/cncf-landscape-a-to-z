project_name: Tremor
homepage_url: https://www.tremor.rs/
repo_url: https://github.com/tremor-rs/tremor-runtime
cncf_status: sandbox
summary: Tremor is an event- or stream-processing engine designed to handle high-volumetric data efficiently in terms of resources and latency.
key_features:
  - Event and stream-processing system optimized for high-volumetric data.
  - Supports structured and binary data (schemaless and strictly schematic).
  - Troy language for configuring pipelines and routing.
  - Connects with Kafka, Influx compatible stores, Open telemetry, S3, and more.
recent_updates: "v0.12.5 Release Notes: Add dynamic metrics configuration to control output. Fix issue where some log messages were dropped during shutdown. Enhance performance of the Kafka connector under high load."
use_cases: "Applying traffic-shaping to a high volume of incoming events, distributing events based on their contents, protecting a downstream system from overload, and performing ETL like tasks on data."
interesting_facts: "Tremor is designed to perform well for high-volumetric data both in terms of consumption of memory and CPU resources and in terms of latency, while providing insightful metrics and helpful error messages at runtime."
get_started: |
  To run tremor locally and introspect its docker environment, do the following:

  make image
  docker run tremorproject/tremor:latest

  Tremor is configured using .troy files written in our own Troy language.
related_tools:
  - Kafka
  - Elasticsearch
  - S3
sources:
  - id: source-0
    title: Tremor Runtime GitHub README
    url: https://github.com/tremor-rs/tremor-runtime
    quotes:
      - "Tremor is a real-time event processing engine built for users that have a high message volume to deal with and want to build pipelines to process, route, or limit this event stream."
      - "In short, Tremor is an event- or stream-processing system. It is designed to perform well for high-volumetric data both in terms of consumption of memory and CPU resources and in terms of latency."
      - "Tremor is well suited for ETL workloads on structured and binary data (both schemaless and strictly schematic), aggregations, traffic shaping and routing purposes."
      - "Tremor speaks various protocols (TCP, UDP, HTTP, Websockets, DNS) and can connect to various external systems such as Kafka, Influx compatible stores, syslog, Open telemetry, Google Pubsub, Google BigQuery, S3 and many more."
      - "You want to apply traffic-shaping to a high volume of incoming events"
