project_name: "Typhoon"
summary: "Typhoon is a minimal and free Kubernetes distribution."
key_features:
  - "Minimal, stable base Kubernetes distribution"
  - "Declarative infrastructure and configuration"
  - "Ready for Ingress, Prometheus, Grafana, CSI, or other addons"
recent_updates: "Add `cloud_provider` variable so \"external\" cloud controller managers may be used (default null)."
use_cases: "Practical for labs, datacenters, and clouds."
interesting_facts: "Typhoon distributes upstream Kubernetes, architectural conventions, and cluster addons, much like a GNU/Linux distribution provides the Linux kernel and userspace components."
get_started: "Define a Kubernetes cluster by using the Terraform module for your chosen platform and operating system."
related_tools:
  - "Terraform"
  - "Kubespray"
  - "kops"
