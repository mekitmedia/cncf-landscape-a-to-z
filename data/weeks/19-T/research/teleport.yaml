project_name: "Teleport"
homepage_url: "https://goteleport.com"
repo_url: "https://github.com/gravitational/teleport"
cncf_status: "non-cncf"
summary: "Teleport is a solution providing connectivity, authentication, access controls, and audit capabilities for infrastructure."
key_features:
  - "Set up single sign-on (SSO) for all of your cloud and on-prem infrastructure."
  - "Protect access to servers, Kubernetes clusters, databases, Windows desktops, web applications, and cloud APIs without long-lived keys or passwords."
  - "Establish secure tunnels to reach resources behind NATs and firewalls without VPNs or bastion hosts."
  - "Record and audit activity across SSH, Kubernetes, database, RDP, and web sessions."
  - "Apply consistent Role-Based and Attribute-Based Access Control (RBAC/ABAC) across users, machines, workloads, and resource types."
  - "Enforce least privilege and Just-in-Time (JIT) access requests for elevated roles or sensitive systems."
  - "Maintain a single identity and access layer for both human users and workloads."
recent_updates: "Teleport 18.10.0 was released on 2026-07-09"
use_cases: "Working with SSH, Kubernetes, databases, RDP, cloud consoles, internal web services, Git repositories, and Model Context Protocol (MCP) servers."
interesting_facts: "While working together at Rackspace, the creators of Teleport noticed that most cloud users struggle with setting up and configuring infrastructure security. Many popular tools designed for this are complex to understand and expensive to maintain across modern, distributed computing infrastructure. We decided to build a solution that's easy to use, understand, and scale. A real-time representation of all your servers in the same room as you, as if they were magically teleported. And thus, Teleport was born!"
get_started: "To set up a single-instance Teleport cluster, follow our getting started guide."
related_tools:
  - "kubernetes"
