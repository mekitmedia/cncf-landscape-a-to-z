project_name: "Topaz"
homepage_url: "https://www.topaz.sh"
repo_url: "https://github.com/aserto-dev/topaz"
cncf_status: "non-cncf"
summary: "Topaz is an open-source authorization service providing fine-grained, real-time, policy-based access control for applications and APIs. It leverages the Open Policy Agent (OPA) as its decision engine and includes a built-in directory inspired by the Google Zanzibar data model."
key_features:
  - "Authorization in one place: Provides a single authorization service to consolidate authorization logic."
  - "Fine-grained: Follows the Principle of Least Privilege to assign the smallest set of fine-grained permissions to each user or group."
  - "Policy-based: Converts authorization code into a policy expressed in a domain-specific language, managed as code, and built into an immutable, signed artifact."
  - "Real-time: Gates each protected resource with an authorization call ensuring correct permissions."
  - "Blazing fast: Deployable as a sidecar or microservice next to the app for low latency and high availability."
  - "Flexible authorization model: Start simple, and grow from multi-tenant RBAC to ABAC or ReBAC, or a combination."
recent_updates: "Release v0.33.22 includes updates such as moving the access .well-known handler registration."
use_cases: "Ideal for applications and APIs that require a cloud-native authorization service with fine-grained, real-time, and policy-based access control combining RBAC, ABAC, and ReBAC models."
interesting_facts: "Topaz uses the Open Policy Agent (OPA) as its decision engine and provides a built-in directory inspired by the Google Zanzibar data model."
get_started: "Install the Topaz container using `topaz install`, and then install a template, such as `topaz templates install todo` to try out sample artifacts."
related_tools:
  - "OPA"
  - "Casbin"
  - "Permit.io"
