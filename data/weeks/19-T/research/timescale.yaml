project_name: Timescale
homepage_url: https://www.timescale.com
repo_url: https://github.com/timescale/timescaledb
cncf_status: non-cncf
summary: TimescaleDB is the leading open-source relational database for time-series
  data. It is packaged as a PostgreSQL extension.
key_features:
- Faster time-based queries with hypertables, continuous aggregates, and columnar
  storage
- Save on storage with native compression, data retention policies, and bottomless
  data tiering to Amazon S3
- Fast and accurate similarity search with the pgvector and pgvectorscale extensions
- Create vector embeddings and perform LLM reasoning on your data with the pgai extension
- ACID compliance, extensive SQL support, JSON handling, and extensibility through
  custom functions, data types, and extensions
- Automatic backups, high availability, read replicas, data forking, connection pooling,
  tiered storage, usage-based storage
recent_updates: TimescaleDB was recently updated on 2026-10-18
use_cases: Ideal for IoT, crypto, finance, SaaS, and a myriad other domains, Timescale
  Cloud allows you to build data-heavy, mission-critical apps while retaining the
  familiarity and reliability of PostgreSQL.
interesting_facts: Timescale Cloud service is a single optimized 100% PostgreSQL database
  instance that you use as is, or extend with capabilities specific to your business
  needs.
get_started: curl -sL https://tsdb.co/start-local | sh
related_tools:
- postgresql
