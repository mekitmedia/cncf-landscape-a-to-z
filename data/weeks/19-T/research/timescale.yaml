project_name: "Timescale"
homepage_url: "https://www.timescale.com"
repo_url: "https://github.com/timescale/timescaledb"
cncf_status: "non-cncf"
summary: "TimescaleDB is a PostgreSQL extension for high-performance real-time analytics on time-series and event data."
key_features:
  - "PostgreSQL extension designed for time-series and event data."
  - "Supports high-performance real-time analytics."
  - "Provides columnstore capabilities for hypertables."
  - "Offers instant analytical query performance."
recent_updates: "TimescaleDB release 2.30.2."
use_cases: "Ideal for handling IoT sensor data, event data, and requiring high-performance real-time analytics over time-series data."
interesting_facts: "Exposes PostgreSQL on a non-standard port (6543) by default in local installations to avoid conflicts with existing PostgreSQL instances."
get_started: |
  Start TimescaleDB locally using Docker:

  docker run -d --name timescaledb \
      -p 6543:5432 \
      -e POSTGRES_PASSWORD=password \
      timescale/timescaledb-ha:pg18

  Connect using psql:

  psql -h localhost -p 6543 -U postgres

  Create a hypertable:

  CREATE TABLE sensor_data (
      time TIMESTAMPTZ NOT NULL,
      sensor_id TEXT NOT NULL,
      temperature DOUBLE PRECISION,
      humidity DOUBLE PRECISION,
      pressure DOUBLE PRECISION
  ) WITH (
      tsdb.hypertable
  );
related_tools: []
