project_name: "Tinkerbell"
homepage_url: https://tinkerbell.org/
repo_url: https://github.com/tinkerbell/tinkerbell
cncf_status: sandbox
summary: "Tinkerbell is a bare metal provisioning engine that supports network and ISO booting, BMC interactions, metadata service, and workflow engine for provisioning."
key_features:
  - "Cloud-init integration"
  - "DHCP with Host reservation or ProxyDHCP"
  - "Third-party DHCP server integration"
  - "BMC support via Redfish, IPMI, IntelAMT, and more"
  - "Auto-discovery of Hardware"
  - "Serial over SSH"
recent_updates: "The latest release is v0.25.0, published on 2026-07-31T23:35:52Z."
use_cases: "Bare metal provisioning, server lifecycle management, automated OS installation, and hardware discovery in data centers or edge locations."
interesting_facts: "Tinkerbell is a CNCF Sandbox project."
get_started: "For more details and to get started, see the Tinkerbell documentation at https://tinkerbell.org."
related_tools:
  - "Metal3"
  - "Cobbler"
  - "Matchbox"
  - "MAAS (Metal as a Service)"
