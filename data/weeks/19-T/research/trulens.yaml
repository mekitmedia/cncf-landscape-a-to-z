project_name: "TruLens"
summary: "TruLens is an open-source, OpenTelemetry-native software tool designed to find where AI agents and LLM applications fail, helping developers reduce costs without losing quality by scoring every step with explainable LLM judges."
key_features:
  - "OpenTelemetry-based tracing captures every function call, LLM generation, retrieval, and tool invocation as a structured OTEL span, making it interoperable with observability tools like Jaeger, Datadog, or Grafana Tempo."
  - "Provides seven purpose-built evaluators for agentic systems, including LogicalConsistency, ExecutionEfficiency, PlanAdherence, ToolSelection, and more to measure agent behavior."
  - "Supports inline evaluation as the app runs or offline batch mode evaluation on a pre-collected dataset."
recent_updates: "Released version 2.14.0."
use_cases: "Tracing and evaluating LLM-based applications, including Agents and RAGs (Retrieval-Augmented Generation) setups, to explain failures, optimize latency, and analyze tokens/costs per step."
interesting_facts: "TruLens is adopted by major enterprises such as Walmart Global Tech, Cisco, J.P. Morgan Chase, and VMware, and features 95% Agent errors caught with Agent GPA."
get_started: "Install via pip: `pip install trulens`. You can optionally install specific LLM provider or app framework integrations such as `trulens-providers-openai` or `trulens-apps-langchain`."
related_tools:
  - "LangChain"
  - "LlamaIndex"
  - "OpenTelemetry"
