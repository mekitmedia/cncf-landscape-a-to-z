project_name: "SuperPlane"
homepage_url: "https://superplane.com"
repo_url: "https://github.com/superplanehq/superplane"
cncf_status: "non-cncf"
summary: "SuperPlane is an open source factory for one-shot engineering that turns high-confidence backlog issues into verified, review-ready pull requests so engineers can focus on work that needs judgment."
key_features:
  - "Factory holds work orders, automation lines and the policies for a team."
  - "Work order records one delegated task from intake through its final outcome."
  - "Line defines the ordered stages that process a work order."
  - "Automation runs an agent, calls a tool, waits for an event or requires approval through a Canvas-backed app."
  - "Run tracks durable execution, inputs, outputs, retries and cost for one automation step."
recent_updates: "SuperPlane coordinates the systems where engineering work already happens. Each integration provides event triggers and actions that you can compose on a Canvas."
use_cases: "Automating routine development work by coordinating coding agents, source control, CI, review, approvals, and feedback."
interesting_facts: "SuperPlane is built on an Apache 2.0 open source engine and lets you choose your models, run in the cloud or on-prem, and build the factory around your stack and cost constraints."
get_started: "Contributor setup is Docker-based. Start with the repository instructions in AGENTS.md and the development section of CONTRIBUTING.md."
related_tools:
  - "kubernetes"
