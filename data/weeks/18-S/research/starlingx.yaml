project_name: "StarlingX"
homepage_url: "https://www.starlingx.io"
repo_url: "https://github.com/starlingx/config"
cncf_status: "non-cncf"
summary: "StarlingX offers a fully integrated edge cloud software stack that provides everything required to deploy an edge cloud on one to 100 servers."
key_features:
  - "Reliable fault management, fast secure VM failover and live migration minimizes downtime"
  - "Scalable from one to thousands of distributed nodes allowing for a single system to be used from edge to core"
  - "Small footprint providing a platform for edge and IoT use cases even for environments with tight resource constraints"
  - "Ultra-low latency with deterministic, tunable performance optimized for the use case"
recent_updates: "The most recent tag is `vtrixie`, released in March 2025."
use_cases: "Industrial IOT, telecom, video delivery and other ultra-low latency use cases."
interesting_facts: "The starlingx/config repository handles the StarlingX configuration management services."
get_started: "To get started fast with StarlingX, try the Virtual All-in-one Simplex Installation , which requires a minimum of hardware and configuration."
related_tools:
  - "OpenStack"
  - "Kubernetes"
