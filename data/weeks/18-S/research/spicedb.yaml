project_name: SpiceDB
homepage_url: https://authzed.com/spicedb
repo_url: https://github.com/authzed/spicedb
cncf_status: non-cncf
summary: SpiceDB is an open source authorization system inspired by Google's Zanzibar,
  offering a mature and scalable solution.
key_features:
- Built by cloud-native ecosystem pioneers, offering robust engineering
- Mature, feature-complete implementation based on Google's Zanzibar paper
- Highly scalable to millions of queries per second with a 5ms p95 latency
- Per-request consistency configuration ensuring both correctness and performance
- Supports caveated relationships, blending ABAC and ReBAC concepts
- Schema design tooling with real-time validation for CI/CD pipelines
- Reverse indexing functionality to query subject permissions and resource accessibility
recent_updates: SpiceDB v1.56.2 was released on 2026-09-11
use_cases: Platform and product teams use SpiceDB to definitively answer access control
  questions like whether a specific subject can perform a certain action on a given
  resource.
interesting_facts: The original inspiration for SpiceDB came from Google's 2019 paper
  on Zanzibar, their globally consistent authorization system.
get_started: docker run --rm -p 50051:50051 -p 8443:8443 authzed/spicedb serve --http-enabled
  true --grpc-preshared-key "somerandomkeyhere"
related_tools:
- kubernetes
