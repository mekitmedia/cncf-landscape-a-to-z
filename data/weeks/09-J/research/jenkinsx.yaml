project_name: "JenkinsX"
cncf_status: "non-cncf"
summary: "Jenkins X (now JayeX) provides an automated CI/CD environment for Kubernetes, using GitOps-based Tekton pipelines, Preview Environments, and ChatOps to streamline software delivery."
key_features:
  - "Automated CI/CD via Tekton pipelines"
  - "GitOps-based Environment Promotion"
  - "Pull Request Preview Environments"
  - "Integrated ChatOps for feedback on commits and PRs"
recent_updates: "Jenkins X has changed its name to JayeX and now supports v3 with a modular CLI approach, including separated components for git operator, kube client, and lighthouse."
use_cases: "Continuous integration, continuous delivery, GitOps automation, preview environments, and ChatOps for Kubernetes-based applications."
interesting_facts: "Jenkins X changed its name to JayeX. Its ecosystem includes modular libraries like jx-git-operator, go-scm, jx-api, and jx-kube-client that have been factored out of the main repository."
get_started: "See the v3 documentation and use the jx command line tool. JayeX spins up automated Tekton pipelines without needing deep Kubernetes expertise."
related_tools:
  - "Tekton"
  - "Kubernetes"
sources:
  - id: 'readme'
    url: 'https://github.com/jenkins-x/jx'
    quotes:
      - "jx is the modular command line CLI for JayeX 3.x"
      - "Jenkins X changes name to JayeX!"
      - "All In One CI/CD including everything you need to start exploring Kubernetes"
      - "Multi-cluster GitOps, Tekton pipelines, Secrets management, Pull Request ChatOps and Preview Environments"
