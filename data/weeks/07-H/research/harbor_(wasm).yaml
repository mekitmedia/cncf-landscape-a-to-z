project_name: "Harbor (Wasm)"
summary: "Harbor is an open source trusted cloud native registry project that stores, signs, and scans content, and includes support for managing WebAssembly (Wasm) artifacts."
key_features:
  - "Cloud native registry with support for container images, Helm charts, and Wasm artifacts"
  - "Role based access control through projects"
  - "Policy based replication"
recent_updates: ""
use_cases: "Container image registry, Helm chart registry, and Wasm artifact storage."
interesting_facts: ""
get_started: |
  Download binaries of **[Harbor release ](https://github.com/goharbor/harbor/releases)** and follow **[Installation & Configuration Guide](https://goharbor.io/docs/latest/install-config/)** to install Harbor.
related_tools: []
