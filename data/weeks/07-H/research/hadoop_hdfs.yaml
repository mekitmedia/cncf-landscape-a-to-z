project_name: "Hadoop HDFS"
homepage_url: "https://hadoop.apache.org/"
repo_url: "https://github.com/apache/hadoop"
cncf_status: "non-cncf"
summary: "The Hadoop Distributed File System (HDFS) is a highly fault-tolerant distributed file system designed to run on commodity hardware, providing high throughput access to application data and suitable for applications with large data sets."
key_features:
  - "Highly fault-tolerant and designed to be deployed on low-cost hardware."
  - "Provides high throughput access to application data, suited for batch processing rather than interactive use."
  - "Tuned to support large files, scaling to hundreds of nodes and tens of millions of files in a single instance."
  - "Simplifies data coherency issues with a write-once-read-many access model for files."
recent_updates: "The most recent tag is `release-3.5.0-RC2`, released in March 2026."
use_cases: "HDFS is primary distributed storage used by Hadoop applications. A MapReduce application or a web crawler application fits perfectly with its write-once-read-many model."
interesting_facts: "HDFS was originally built as infrastructure for the Apache Nutch web search engine project."
get_started: "The command `bin/hdfs dfs -help` lists the commands supported by Hadoop shell to interact with HDFS."
related_tools:
  - "Apache Spark"
  - "Apache Flink"
  - "Apache Hadoop"
sources:
  - id: "source-0"
    title: "HDFS Architecture"
    url: "https://raw.githubusercontent.com/apache/hadoop/trunk/hadoop-hdfs-project/hadoop-hdfs/src/site/markdown/HdfsDesign.md"
    quotes:
      - "The Hadoop Distributed File System (HDFS) is a distributed file system designed to run on commodity hardware."
      - "HDFS is highly fault-tolerant and is designed to be deployed on low-cost hardware."
      - "HDFS provides high throughput access to application data and is suitable for applications that have large data sets."
      - "HDFS was originally built as infrastructure for the Apache Nutch web search engine project."
      - "Applications that run on HDFS have large data sets. A typical file in HDFS is gigabytes to terabytes in size. Thus, HDFS is tuned to support large files. It should provide high aggregate data bandwidth and scale to hundreds of nodes in a single cluster. It should support tens of millions of files in a single instance."
      - "HDFS applications need a write-once-read-many access model for files."
      - "A MapReduce application or a web crawler application fits perfectly with this model."
  - id: "source-1"
    title: "HDFS Users Guide"
    url: "https://raw.githubusercontent.com/apache/hadoop/trunk/hadoop-hdfs-project/hadoop-hdfs/src/site/markdown/HdfsUserGuide.md"
    quotes:
      - "HDFS is the primary distributed storage used by Hadoop applications."
      - "The command `bin/hdfs dfs -help` lists the commands supported by Hadoop shell."
