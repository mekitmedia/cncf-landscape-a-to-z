project_name: "Litmus"
homepage_url: "https://litmuschaos.io/"
repo_url: "https://github.com/litmuschaos/litmus"
cncf_status: "incubating"
summary: "Litmus is a tool for Cloud-Native Chaos Engineering that lets teams test and improve infrastructure resilience by introducing controlled faults."
key_features:
  - "Chaos Control Plane: Centralized management using chaos-center"
  - "Chaos Execution Plane: Operators and agents that execute faults in Kubernetes"
  - "ChaosExperiment: Reusable templates defining fault configurations"
  - "ChaosEngine: Links application workloads to specific ChaosExperiments"
  - "ChaosResult: Captures and holds the outcome of experiment runs"
recent_updates: "Litmus v3.33.0 was released on 2026-10-15"
use_cases: "- **For Developers**: To run chaos experiments during application development as an extension of unit testing or integration testing.\n- **For CI/CD pipeline builders**: To run chaos as a pipeline stage to find bugs when the application is subjected to fail paths in a pipeline.\n- **For SREs**: To plan and schedule chaos experiments into the application and/or surrounding infrastructure. This practice identifies the weaknesses \n  in the deployment system and increases resilience."
interesting_facts: "Litmus adopts a \"Kubernetes-native\" approach to define chaos intent in a declarative manner via Kubernetes custom resources (CRs)."
get_started: "helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/\nhelm install chaos litmuschaos/litmus --namespace=litmus --set portal.frontend.service.type=NodePort"
related_tools:
  - "kubernetes"
sources:
  - id: "source-0"
    title: "Litmus README"
    url: "https://github.com/litmuschaos/litmus/blob/master/README.md"
    quotes:
      - "LitmusChaos is an open source Chaos Engineering platform that enables teams to identify weaknesses & potential outages in infrastructures by \ninducing chaos tests in a controlled way."
      - "- **Chaos Control Plane**: A centralized chaos management tool called chaos-center, which helps construct, schedule and visualize Litmus chaos workflows"
      - "- **Chaos Execution Plane Services**: Made up of a chaos agent and multiple operators that execute & monitor the experiment within a defined \n  target Kubernetes environment."
      - "- **ChaosExperiment**: A resource to group the configuration parameters of a particular fault."
      - "- **ChaosEngine**: A resource to link a Kubernetes application workload/service, node or an infra component to a fault described by the ChaosExperiment."
      - "- **ChaosResult**: A resource to hold the results of the experiment run."
      - "- **For Developers**: To run chaos experiments during application development as an extension of unit testing or integration testing."
      - "- **For CI/CD pipeline builders**: To run chaos as a pipeline stage to find bugs when the application is subjected to fail paths in a pipeline."
      - "- **For SREs**: To plan and schedule chaos experiments into the application and/or surrounding infrastructure. This practice identifies the weaknesses \n  in the deployment system and increases resilience."
  - id: "source-1"
    title: "Litmus Docs"
    url: "https://docs.litmuschaos.io"
    quotes:
      - "Litmus can be used to run chaos experiments initially in the staging environment and eventually in production to find bugs and vulnerabilities, fixing which leads to an increased resilience of the system."
      - "Litmus adopts a \"Kubernetes-native\" approach to define chaos intent in a declarative manner via Kubernetes custom resources (CRs)."
      - "helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/"
      - "helm install chaos litmuschaos/litmus --namespace=litmus --set portal.frontend.service.type=NodePort"
