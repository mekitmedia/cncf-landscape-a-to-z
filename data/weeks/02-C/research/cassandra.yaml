project_name: "Cassandra"
homepage_url: "https://cassandra.apache.org/"
repo_url: "https://github.com/apache/cassandra"
cncf_status: "non-cncf"
summary: "Apache Cassandra is an open source transactional distributed database designed for managing massive amounts of data across commodity hardware or cloud infrastructure, offering linear scalability and proven fault-tolerance without compromising performance."
key_features:
  - "Distributed Database: Highly-scalable partitioned row store."
  - "Partitioning: Distributes data across multiple machines transparently, automatically repartitioning as nodes are added or removed."
  - "Row Store & CQL: Organizes data by rows and columns, similar to relational databases, queryable using the Cassandra Query Language (CQL)."
recent_updates: "Cassandra 5.0.9 released with ongoing enhancements."
use_cases: "Ideal for applications requiring massive scale, high availability, and no single point of failure."
interesting_facts: "Cassandra's partitioning allows it to automatically repartition data as machines are dynamically added and removed from the cluster."
get_started: "Download the archive, extract it, and start the server using `bin/cassandra -f`. You can then interact with it using `bin/cqlsh`."
related_tools:
  - "ScyllaDB"
  - "HBase"
  - "MongoDB"
latest_release:
  version: "cassandra-5.0.9"
  date: "2026-07-28T10:57:24Z"
  url: "https://github.com/apache/cassandra/releases/tag/cassandra-5.0.9"
sources:
