    title: "Apache Cassandra GitHub Repository"
    url: "https://github.com/apache/cassandra"
    quotes:
      - "Open source transactional distributed database. Linear scalability and proven fault-tolerance on commodity hardware or cloud infrastructure without compromising performance."
  - id: "source-2"
    title: "Apache Cassandra README"
    url: "https://github.com/apache/cassandra/blob/trunk/README.asc"
    quotes:
      - "Apache Cassandra is a highly-scalable partitioned row store."
      - "Partitioning means that Cassandra can distribute your data across multiple machines in an application-transparent matter. Cassandra will automatically repartition as machines are added and removed from the cluster."
      - "Row store means that like relational databases, Cassandra organizes data by rows and columns. The Cassandra Query Language (CQL) is a close relative of SQL."
