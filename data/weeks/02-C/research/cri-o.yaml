project_name: CRI-O
homepage_url: https://cri-o.io/
repo_url: https://github.com/cri-o/cri-o
docs_url: https://cri-o.io/#documentation
cncf_status: graduated
summary: CRI-O is a lightweight, OCI-compliant container runtime engine purpose-built specifically for
  Kubernetes.
key_features:
- Direct implementation of the Kubernetes Container Runtime Interface (CRI).
- OCI-compliant runtime supporting runc, crun, Kata Containers, and gVisor.
- Secure image management using containers/image and rootless container isolation.
- Optimized memory footprint and fast container startup performance without legacy daemon bloat.
recent_updates: Ongoing releases delivering enhanced pod cgroup v2 support, NRI (Node Resource Interface)
  plugins, and improved image verification.
use_cases: Production Kubernetes container execution, enterprise OpenShift clusters, and zero-overhead
  edge container runtime nodes.
ecosystem_perspectives:
  strengths: Graduated CNCF project designed solely for Kubernetes, ensuring clean architectural boundaries
    without auxiliary daemon bloat.
  considerations: Strictly scoped to Kubernetes CRI; cannot be used as a standalone desktop or ad-hoc
    CLI container engine like Docker.
  community_discussions:
  - Favored by OpenShift and enterprise distributions prioritizing minimal attack surface and pure Kubernetes
    alignment.
interesting_facts: CRI-O was named to reflect the integration of the Kubernetes Container Runtime Interface
  (CRI) with Open Container Initiative (OCI) standards.
get_started: Install CRI-O packages for your Linux distribution, enable crio.service, and configure the
  kubelet with --container-runtime-endpoint=unix:///var/run/crio/crio.sock.
related_tools:
- containerd
- runc
- crun
