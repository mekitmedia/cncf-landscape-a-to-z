    source_type: "github_release"
    quotes:
      - "CubeSandbox 0.7.1 introduces 1 major feature along with multiple enhancements and bug fixes. 70 commits from 24 contributors. End-to-end high availability for Cube control-plane services. A standalone template-center service enables multi-replica CubeMaster deployment."
