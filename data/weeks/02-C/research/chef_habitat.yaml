  url: https://github.com/habitat-sh/habitat
  source_type: github_readme
  quotes:
  - The goal of Habitat is to allow you to automate your application behavior when you create your application,
    and then bundle your application with the automation it needs to behave with the correct run time
    behavior, update strategies, failure handling strategies, and scaling behavior, wherever you choose
    to deploy it.
