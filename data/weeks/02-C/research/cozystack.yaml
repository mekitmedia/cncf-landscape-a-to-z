project_name: "Cozystack"
homepage_url: "https://cozystack.io"
repo_url: "https://github.com/cozystack/cozystack"
cncf_status: "sandbox"
summary: "Cozystack is a free and open-source platform and framework for building clouds. It allows you to transform a bunch of servers into an intelligent system with a simple REST API for spawning Kubernetes clusters, Database-as-a-Service, virtual machines, load balancers, HTTP caching services, and other services with ease."
key_features:
  - "Build your own cloud: Transform bare metal servers into an intelligent cloud platform."
  - "Kubernetes-as-a-Service: Easily spawn and manage Kubernetes clusters."
  - "Database-as-a-Service: Provision and manage databases efficiently."
  - "Virtual Machines & Load Balancers: Support for VMs and load balancing services."
  - "HTTP Caching Services: Includes features for HTTP caching."
recent_updates: "The latest release is v1.6.4."
use_cases: "Cozystack can be used to build a public cloud, a private cloud using an Infrastructure-as-Code approach, or as a Kubernetes distribution for Bare Metal."
interesting_facts: "Cozystack was originally built and sponsored by Ænix and is now a CNCF Sandbox project."
get_started: "Read the Getting Started section on cozystack.io for a quick start. It involves transforming your servers using the provided platform and REST API."
related_tools:
  - "Kubernetes"
  - "OpenStack"
