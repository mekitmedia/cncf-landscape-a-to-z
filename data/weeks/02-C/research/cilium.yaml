  quotes:
  - Cilium is a networking, observability, and security solution with an eBPF-based dataplane.
  - It provides a simple flat Layer 3 network with the ability to span multiple clusters in either a native
    routing or overlay mode.
  - It is L7-protocol aware and can enforce network policies on L3-L7 using an identity-based security
    model
