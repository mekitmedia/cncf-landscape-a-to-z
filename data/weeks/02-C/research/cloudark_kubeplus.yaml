  source_type: github_readme
  quotes:
  - KubePlus is a Kubernetes Operator that enables teams to deliver applications as managed, multi-tenant
    services on Kubernetes. It bridges the gap between deploying an application and operating it at scale
    for multiple customers or internal teams, automating the isolation, access control, and lifecycle
    management that true multi-tenancy requires.
