project_name: Carina
homepage_url: https://carina.io/
repo_url: https://github.com/carina-io/carina
docs_url: https://carina-io.github.io/carina/
cncf_status: sandbox
summary: Carina is an open-source CNCF Sandbox CSI plugin that provides high-performance, operations-free
  local storage virtualization for Kubernetes.
key_features:
- Local storage virtualization pooling local NVMe, SSD, and HDD disks into managed dynamic volume groups.
- CSI-compliant dynamic volume provisioning with automated LVM (Logical Volume Manager) management.
- Storage-aware pod scheduling matching workloads to nodes with optimal available local disk capacity.
- Volume resizing, disk tiering, and raw block volume support for maximum I/O throughput.
recent_updates: Recent updates add support for Kubernetes 1.30+ CSI specifications, optimized LVM snapshotting,
  and improved disk failure detection.
use_cases: High-IOPS databases (ClickHouse, MySQL, Elasticsearch), local cache nodes, and latency-critical
  stateful Kubernetes applications.
ecosystem_perspectives:
  strengths: Zero-overhead bare-metal NVMe disk speeds with the convenience of automated Kubernetes CSI
    dynamic provisioning.
  considerations: Local storage is node-bound; workloads require application-level replication (e.g. database
    clustering) to tolerate node hardware failures.
  community_discussions:
  - Popular among database administrators running real-time databases on Kubernetes who cannot afford
    the latency of network-attached storage.
interesting_facts: Carina dynamically manages Linux LVM under the hood to slice physical NVMe drives into
  micro-volumes without requiring manual node intervention.
get_started: Install Carina via Helm, annotate worker nodes with local disks, and create PersistentVolumeClaims
  referencing the carina-sc storage class.
related_tools:
- OpenEBS LocalPV
- Rook
- Ceph
