  title: Carina GitHub README
  url: https://github.com/carina-io/carina
  source_type: github_readme
  quotes:
  - Storage systems are complex! There are more and more kubernetes native storage systems nowadays and
    stateful applications are shifting into cloud native world, for example, modern databases and middlewares.
    However, both modern databases and its storage providers try to solve some common problems in their
    own way. For example, they both deal with data replications and consistency. This introduces a giant
    waste of both capacity and performance and needs more mantainness effort. And besides that, stateful
    applications strive to be more peformant, eliminating every possible latency, which is unavoidable
    for modern distributed storage systems. Enters carina.
