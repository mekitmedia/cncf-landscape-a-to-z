project_name: "Coroot"
summary: "An open-source observability and APM tool with AI-powered Root Cause Analysis. It brings together metrics, logs, traces, continuous profiling, and SLO-based alerting into a unified platform."
key_features:
  - "Zero-instrumentation observability automatically gathered by using eBPF."
  - "Service Map that covers 100% of your system with no blind spots."
  - "Predefined inspections audit each application without any configuration."
  - "Application Health Summary for tracking service status, logs, and SLOs (Service Level Objectives)."
  - "Distributed tracing with Vendor-neutral instrumentation via OpenTelemetry."
  - "Logs-to-traces correlation and event clustering backed by ClickHouse."
  - "One-click continuous profiling down to the precise line of code."
  - "Built-in expertise automatically identifies over 80% of issues and aggregates alerts."
  - "Deployment tracking of Kubernetes rollouts without requiring CI/CD integration."
  - "Cost Monitoring for AWS, GCP, Azure down to the specific application."
recent_updates: ""
use_cases: "Zero-instrumentation observability with eBPF, continuous profiling, and AI-powered Root Cause Analysis for Kubernetes and containerized applications."
interesting_facts: "Coroot can automatically identify over 80% of issues and uses eBPF to capture requests without requiring any code changes, including for legacy or third-party services."
get_started: "You can run Coroot as a Docker container or deploy it into any Kubernetes cluster. Check out the [Installation guide](https://docs.coroot.com/)."
related_tools: []
sources:
  - id: 'readme'
    url: 'https://github.com/coroot/coroot#readme-ov-file'
    quotes:
      - "Coroot is an open-source observability and APM tool with AI-powered Root Cause Analysis. It combines metrics, logs, traces, continuous profiling, and SLO-based alerting with predefined dashboards and inspections."
      - "Collecting metrics, logs, and traces alone doesn't make your applications observable. Coroot turns that data into actionable insights for you!"
      - "Metrics, logs, traces, and profiles are gathered automatically by using eBPF"
      - "Coroot provides you with a Service Map that covers 100% of your system with no blind spots"
      - "Predefined inspections audit each application without any configuration"
      - "Easily understand the status of your services, even when dealing with hundreds of them"
      - "SLOs (Service Level Objectives) tracking"
      - "Investigate any anomaly with just one click"
      - "Vendor-neutral instrumentation with OpenTelemetry"
      - "Coroot's eBPF-based instrumentation can capture requests without requiring any code changes."
      - "Log patterns: out-of-the-box event clustering"
      - "Seamless logs-to-traces correlation"
      - "Lightning-fast search based on ClickHouse"
      - "Analyze any unexpected spike in CPU or memory usage down to the precise line of code"
      - "Coroot can automatically identify over 80% of issues"
      - "If an app is not meeting its Service Level Objectives (SLOs), Coroot will send a single alert that includes the results of all relevant inspections"
      - "Coroot discovers and monitors every application rollout in your Kubernetes cluster"
      - "Requires no integration with your CI/CD pipeline"
      - "With integrated Cost Monitoring, developers can track how each change affects their cloud bill"
      - "Understand your cloud costs down to the specific application"
