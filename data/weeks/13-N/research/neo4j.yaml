project_name: "Neo4j"
summary: "Neo4j is the world's leading Graph Database. It is a high-performance graph store with all the features expected of a mature and robust database, like a friendly query language and ACID transactions."
key_features:
  - "Provides a flexible network structure of nodes and relationships rather than static tables."
  - "Offers ACID transactions for data reliability and consistency."
  - "Features Cypher, a powerful and friendly graph query language."
  - "Includes Neo4j Aura, a fully managed graph database solution for quick and easy deployment."
recent_updates: "Release 3.2.0-alpha08 introduced improvements to Cypher execution speed on variable length queries, allowed more granular configuration of literals extraction, and added a new Editor role for enhanced security."
use_cases: "Ideal for applications requiring high-performance graph traversal, complex relationship mapping, recommendation engines, fraud detection, and knowledge graph management."
interesting_facts: "For many applications, Neo4j offers orders of magnitude performance benefits compared to relational databases by treating relationships as first-class citizens."
get_started: "Get started for free using Neo4j Aura at https://console.neo4j.io, or download the standalone server from https://neo4j.com/deployment-center."
related_tools:
  - "ArangoDB"
  - "OrientDB"
  - "NebulaGraph"
latest_release:
  version: "3.2.0-alpha08"
  date: "2017-04-11T08:47:47Z"
  url: "https://github.com/neo4j/neo4j/releases/tag/3.2.0-alpha08"
sources:
  - id: "source-1"
    title: "Neo4j GitHub Repository README"
    url: "https://github.com/neo4j/neo4j"
    quotes:
      - "Neo4j is the world's leading Graph Database. It is a high performance graph store with all the features expected of a mature and robust database, like a friendly query language and ACID transactions."
      - "The programmer works with a flexible network structure of nodes and relationships rather than static tables -- yet enjoys all the benefits of enterprise-quality database."
      - "For many applications, Neo4j offers orders of magnitude performance benefits compared to relational DBs."
      - "Neo4j Aura is the fully managed graph database solution for Neo4j. You can quickly get started in seconds and use Neo4j for free - no credit card required."
  - id: "source-2"
    title: "Neo4j v3.2.0-alpha08 Release Notes"
    url: "https://github.com/neo4j/neo4j/releases/tag/3.2.0-alpha08"
    quotes:
      - "Improved cypher execution speed on variable length queries where only the distinct pairs of start and end node are of interest."
      - "Allow more granular configuration of literals extraction"
      - "Added new role `Editor` that is allowed to read and write data but not allowed to create new tokens."
