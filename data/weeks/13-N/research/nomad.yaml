project_name: "Nomad"
homepage_url: "https://www.nomadproject.io/"
repo_url: "https://github.com/hashicorp/nomad"
cncf_status: "non-cncf"
summary: "Nomad is an easy-to-use, flexible, and performant workload orchestrator that can deploy a mix of microservice, batch, containerized, and non-containerized applications. Nomad is easy to operate and scale and has native Consul and Vault integrations."
key_features:
  - "Deploy Containers and Legacy Applications: Nomad’s flexibility as an orchestrator enables an organization to run containers, legacy, and batch applications together on the same infrastructure."
  - "Simple & Reliable: Nomad runs as a single binary and is entirely self contained - combining resource management and scheduling into a single system."
  - "Device Plugins & GPU Support: Nomad offers built-in support for GPU workloads such as machine learning (ML) and artificial intelligence (AI)."
  - "Federation for Multi-Region, Multi-Cloud: Nomad supports federation out-of-the-box and can deploy applications across multiple regions and clouds."
  - "Proven Scalability: Nomad has been proven to scale to clusters of 10K+ nodes in real-world production environments."
  - "HashiCorp Ecosystem: Nomad integrates seamlessly with Terraform, Consul, Vault for provisioning, service discovery, and secrets management."
