summary: "An open source release engineering, deployment, and lifecycle management tool for distributed systems."
key_features:
  - "Unifies release engineering, deployment, and lifecycle management of small and large-scale cloud software."
  - "Performs monitoring, failure recovery, and software updates with zero-to-minimal downtime."
  - "Supports multiple Infrastructure as a Service (IaaS) providers like VMware vSphere, Google Cloud Platform, Amazon Web Services EC2, Microsoft Azure, OpenStack, and Alibaba Cloud."
recent_updates: "The latest release is v283.1.13, published on 2026-10-10."
use_cases: "Provision and deploy software over hundreds of VMs, particularly well-suited for large distributed systems like Cloud Foundry PaaS or Hadoop."
interesting_facts: "Bosh is deployed by Bosh. To bootstrap a new Bosh server from scratch, the Bosh CLI acts as a lightweight Bosh server."
get_started: "To bootstrap a new Bosh server from scratch, use the Bosh CLI with the `bosh create-env` command."
related_tools:
  - "Cloud Foundry"
  - "Kubernetes"
