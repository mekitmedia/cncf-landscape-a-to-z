project_name: Mermin
homepage_url: https://github.com/elastiflow/mermin
repo_url: https://github.com/elastiflow/mermin
cncf_status: non-cncf
summary: Mermin is a powerful, Kubernetes-native network observability tool that utilizes
  eBPF to capture network traffic efficiently and exports it as Flow Traces through
  the OpenTelemetry Protocol (OTLP). It offers comprehensive visibility into cluster
  network communications without requiring any changes to the application code.
key_features:
- Uses eBPF to auto-instrument the network layer without sidecars or application changes.
- Captures granular, bidirectional network flows instead of just aggregated metrics
  or full packet captures.
- Enriches flows with native Kubernetes metadata, showing communications between Pods,
  Services, and Deployments.
- Exports network traffic as standard OpenTelemetry Flow Traces via OTLP to seamlessly
  integrate with existing observability backends.
- Deploys simply as a DaemonSet for low-overhead, kernel-level traffic capture suitable
  for always-on production environments.
recent_updates: Mermin aggregates packets into flows with connection state tracking
  and enriches them with Kubernetes context before converting them to OpenTelemetry
  trace spans.
use_cases: Ideal for bridging the gap between application performance monitoring and
  IP-level network statistics, allowing teams to correlate slow network spans in traces
  with actual network flow data and pinpoint network congestion back to specific services.
interesting_facts: "Mermin's approach to network observability sits in a 'sweet spot'\u2014\
  it avoids the high storage and querying costs of raw PCAP files while providing\
  \ the rich connection context (like timing and directionality) that simple network\
  \ metrics lack."
get_started: Deploy Mermin via Helm using `helm repo add elastiflow https://elastiflow.github.io/mermin`
  followed by `helm install mermin elastiflow/mermin --namespace mermin --create-namespace`.
related_tools:
- Jaeger
- Tempo
- Istio
