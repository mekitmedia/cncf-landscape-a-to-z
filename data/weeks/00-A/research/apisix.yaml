project_name: "APISIX"
summary: "Apache APISIX is a dynamic, real-time, high-performance API Gateway. It provides rich traffic management features such as load balancing, dynamic upstream, canary release, circuit breaking, authentication, observability, and more."
key_features:
  - "Dynamic and real-time configuration without restarts"
  - "Support for HTTP, TCP, UDP, gRPC, and MQTT proxy"
  - "Extensive ecosystem of plugins (authentication, security, traffic control, observability)"
  - "High performance based on Nginx and LuaJIT"
recent_updates: "Actively developed by the Apache Software Foundation as a leading Cloud-Native API Gateway and AI Gateway."
use_cases: "Used to handle traditional north-south traffic, as well as east-west traffic between microservices."
interesting_facts: "Graduated as a Top-Level Project in the Apache Software Foundation."
get_started: "Visit https://apisix.apache.org/ or check out the GitHub repository at https://github.com/apache/apisix to get started."
related_tools:
  - "Kong"
  - "Tyk"
  - "Envoy"
