summary: An open-source deployment option from AWS that allows users to create and operate consistent on-premises Kubernetes clusters using Amazon EKS tooling.
key_features:
- Consistent operational tooling and Kubernetes versions aligned with AWS EKS.
- Support for VMware vSphere, bare metal, Nutanix, and CloudStack.
- Integrated cluster lifecycle management using Cluster API (CAPI).
- Bundled components including Cilium CNI, CoreDNS, and Flux.
recent_updates: Expanded bare metal hardware validation and enhanced air-gapped installation support.
use_cases: Running regulated workloads on-premises while maintaining operational consistency with AWS cloud.
ecosystem_perspectives:
  strengths: High performance and strong cloud native integration for Amazon Elastic Kubernetes Service Anywhere (Amazon EKS Anywhere).
  considerations: Requires architectural evaluation and cluster operational planning.
  community_discussions:
  - Active discussions across the cloud native community regarding Amazon Elastic Kubernetes Service Anywhere (Amazon EKS Anywhere) adoption.
interesting_facts: Amazon Elastic Kubernetes Service Anywhere (Amazon EKS Anywhere) is widely utilized across the cloud native and open source ecosystem.
get_started: Install `eksctl-anywhere` and run `eksctl anywhere create cluster`.
related_tools:
- Amazon EKS-D
- Cluster API
- KinD
