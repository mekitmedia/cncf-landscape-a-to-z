project_name: "Athenz"
summary: "Open source platform for X.509 certificate based service authentication and fine grained access control in dynamic infrastructures."
key_features:
  - "X.509 Certificate Based Authentication"
  - "Fine-grained Authorization (RBAC with JWT)"
  - "Decentralized Access Control"
  - "Zero Trust capabilities (traffic encryption, AuthN, AuthZ)"
recent_updates: "Adopted by LY Corporation as the core authorization engine for Flava IAM."
use_cases: "Service identity in the form of short-lived X.509 certificates to all workloads deployed in private or public clouds, Authorization and identity provider solution for Kubernetes clusters, Service to service authorization."
interesting_facts: "Enables zero trust core principles like traffic encryption, AuthN, AuthZ, Dynamic Trust and least privilege access."
get_started: "Read the documentation or clone the GitHub repo at https://github.com/AthenZ/athenz"
related_tools:
  - "SPIRE"
