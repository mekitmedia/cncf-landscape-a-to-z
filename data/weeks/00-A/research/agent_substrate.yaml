recent_updates: Initial release of Agent Substrate featuring zero-trust sandboxing for millions of agents on Kubernetes.
use_cases: Running autonomous, untrusted, mostly-idle AI agents on standard Kubernetes.
interesting_facts: Built for 10x higher density than standard containers, delivering fast resume operations in less than 400ms.
get_started: Follow the Quickstart Guide in the GitHub repository.
