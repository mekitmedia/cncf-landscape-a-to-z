summary: A CNCF graduated suite of open-source Kubernetes-native tools for workflows, events, continuous delivery (CD), and progressive rollouts.
key_features:
- 'Argo CD: Declarative GitOps continuous delivery keeping cluster state in sync with Git.'
- 'Argo Workflows: Kubernetes-native workflow engine for parallel compute and ML DAGs.'
- 'Argo Rollouts: Advanced progressive delivery controller for Canary and Blue-Green deployments.'
- 'Argo Events: Event-driven workflow automation framework triggered by webhooks, Kafka, S3.'
recent_updates: Graduated CNCF project, expanding multi-cluster management at scale and enterprise RBAC.
use_cases: Automating GitOps continuous delivery across Kubernetes fleets and orchestrating distributed ML workflows.
