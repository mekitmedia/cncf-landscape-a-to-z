project_name: "Aeraki Mesh"
summary: "A CNCF sandbox project providing a non-intrusive, extendable way to manage any layer-7 traffic in a service mesh, extending beyond HTTP/gRPC."
key_features:
  - "Extends Istio to support various layer-7 protocols like Dubbo, Thrift, Kafka, Redis."
  - "Uses MetaProtocol Proxy for unified traffic management."
  - "Dynamic route updates through Aeraki MetaRDS."
  - "Provides request-level metrics, distributed tracing, and access logs for all supported protocols."
  - "Supports advanced traffic management like load balancing, circuit breaking, traffic splitting, and rate limiting."
recent_updates: "Aeraki Mesh continues to expand its protocol support and improve integration with Envoy and Istio. It allows users to write custom codecs to support proprietary layer-7 protocols."
use_cases: "Ideal for microservices architectures that use a mix of protocols (RPC, messaging, caching, databases) and need a unified service mesh to manage all of them, rather than just HTTP traffic."
interesting_facts: "Aeraki (Air-rah-ki) is the Greek word for 'breeze'. It avoids reinventing the wheel by letting existing tools handle HTTP while it manages other layer-7 protocols."
get_started: "Visit the Aeraki Mesh quickstart guide on aeraki.net to deploy it alongside an Istio installation, or install it via Helm."
related_tools:
  - "Istio"
  - "Envoy"
  - "Linkerd"
