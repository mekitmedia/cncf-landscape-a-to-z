project_name: Astron Agent
summary: Astron Agent is an enterprise-grade, commercial-friendly agentic workflow
  development platform that integrates AI workflow orchestration, model management,
  AI and MCP tool integration, RPA automation, and team collaboration features.
key_features:
- AI workflow orchestration and model management
- AI and MCP tool integration
- Native intelligent RPA integration for connecting enterprise systems
- High-availability deployment architecture
- Enterprise-grade open ecosystem compatible with various industry models
recent_updates: Released v1.1.2 Security Release addressing unsafe workflow code-node
  execution. Migrated to built-in isolated LangChain/Pyodide executor by default for
  local code execution. Added Langfuse integration and end-to-end agent traces. Strengthened
  authentication on internal Workflow and Tenant service APIs.
use_cases: Building scalable, production-ready intelligent agent applications. Orchestrating
  complex multi-agent workflows. Automating enterprise processes using intelligent
  RPA. Developing AI foundation for organizations with team collaboration.
interesting_facts: Built on the same core technology as the iFLYTEK Astron Agent Platform.
  Deeply compatible with Model Context Protocol (MCP) and various industry models.
  Released under the permissive Apache 2.0 License allowing free commercial use.
get_started: 'Deploy using Docker Compose: `git clone https://github.com/iflytek/astron-agent.git
  && cd docker/astronAgent && docker compose -f docker-compose-with-auth.yaml up -d`.
  Access the Casdoor Admin Interface at `http://localhost:8000` (default login: admin/123).
  Access the Application Frontend at `http://localhost/`'
related_tools:
- SkillHub
- AstronRPA
- LangChain
- Casdoor
