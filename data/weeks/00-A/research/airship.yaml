project_name: Airship
homepage_url: https://www.airshipit.org/
repo_url: https://github.com/airshipit/treasuremap
docs_url: https://docs.airshipit.org/
cncf_status: non-cncf
latest_release:
  version: v2.1.0
  date: '2021-12-06T20:04:17Z'
  release_notes_url: https://github.com/airshipit/treasuremap/releases/tag/v2.1.0
summary: Airship is a collection of open source tools that automate cloud provisioning and lifecycle management for infrastructure and applications using declarative configuration.
key_features:
  - Declarative configuration management for infrastructure and applications.
  - Lifecycle management of bare-metal and virtual infrastructure.
  - Integration with Kubernetes and cluster API providers.
  - Uses airshipctl to deploy Kubernetes and pre-configured workloads.
recent_updates: "Airship released version v2.1.0 of the Treasuremap reference architecture which includes YAML documents for use with airshipctl."
use_cases: "Deploying and managing Kubernetes clusters on bare-metal and virtual infrastructure, managing OpenStack lifecycle, and providing reproducible edge environments."
ecosystem_perspectives:
  strengths: "Provides a standard, repeatable process with declarative configuration out of the box."
  considerations: "Requires familiarity with Kubernetes, bare-metal provisioning tools, and potentially OpenStack."
  community_discussions:
    - Supported by the Open Infrastructure Foundation and used for deploying large scale telco clouds.
interesting_facts: "Treasuremap serves as the reference architecture, providing ready-to-use YAML documents for airshipctl."
get_started: "Check out the Airship in a POD (AIAP) guide to easily spin up a test environment, or use airshipctl."
related_tools:
  - Argo
  - Flux
  - Cluster API
