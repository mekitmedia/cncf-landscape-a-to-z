summary: Airship (specifically its Treasuremap repository) provides a declarative
  framework for deploying and managing cloud infrastructure using Kubernetes, Helm,
  and bare-metal provisioning tools.
key_features:
- 'Declarative Infrastructure: Fully YAML-driven lifecycle management using airshipctl.'
- 'Baremetal and Virtual Provisioning: Manages both virtual machines and bare-metal
  servers.'
- 'Pre-configured Workloads: Provides ready-to-use reference architectures (Treasuremap)
  for OpenStack and Kubernetes deployments.'
recent_updates: The v2.1.0 release updated components for multi-tenant cluster control
  planes, enhanced Dex deployment for sub-cluster authentication, and replaced the
  minio component with the minio operator.
use_cases: Automating the deployment of OpenStack on top of Kubernetes, managing telecom
  and edge cloud infrastructure, and handling complete life-cycle management of bare
  metal clusters.
ecosystem_perspectives:
  strengths: Offers a robust, end-to-end declarative approach to infrastructure deployment,
    deeply integrated with the OpenStack Foundation.
  considerations: Primarily targeted at complex, large-scale deployments like telecommunications,
    which may have a steep learning curve for simpler use cases.
  community_discussions:
  - Often discussed in the context of the OpenInfra Foundation and telecom deployments
    utilizing Kubernetes and OpenStack.
interesting_facts: The 'Treasuremap' repository acts as the reference architecture
  collection, providing the foundational YAML manifests that airshipctl uses to deploy
  environments.
get_started: Review the documentation at docs.airshipit.org and explore the Treasuremap
  repository for reference manifests to use with airshipctl.
related_tools:
- OpenStack
- Metal3
- Cluster API
- Helm
