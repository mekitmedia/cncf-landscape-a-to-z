summary: A collection of loosely coupled, declarative open-source tools for automating cloud provisioning and lifecycle management using Kubernetes and YAML.
key_features:
- Declarative infrastructure management driven by Kubernetes CRDs.
- Unified lifecycle automation for bare metal, VMs, and control planes.
- Integration with Metal3-io for bare-metal provisioning.
- Seamless upgrades and rollback capabilities.
recent_updates: Airship 2.0 leveraged Cluster API (CAPI) and Kustomize for unified configuration.
use_cases: Automating telecommunications cloud infrastructure and private cloud bare metal lifecycle.
ecosystem_perspectives:
  strengths: High performance and strong cloud native integration for Airship.
  considerations: Requires architectural evaluation and cluster operational planning.
  community_discussions:
  - Active discussions across the cloud native community regarding Airship adoption.
interesting_facts: Airship is widely utilized across the cloud native and open source ecosystem.
get_started: Use `airshipctl` CLI to bootstrap ephemeral clusters and provision target sites.
