summary: Airship is a collection of open source tools to automate cloud provisioning
  and management in a declarative way.
key_features:
- Declarative cloud provisioning
- Kubernetes workload deployment on baremetal and virtual infrastructure
- Management through a unified CLI (airshipctl)
recent_updates: Latest version v2.1.0 was released on 2021-12-06, focusing on stabilizing
  the airshipctl and reference manifests.
use_cases: Ideal for operators looking to deploy Kubernetes and pre-configured workloads
  on baremetal infrastructures declaratively.
ecosystem_perspectives: Airship integrates tightly with Kubernetes and Helm, providing
  a comprehensive platform for managing edge and cloud infrastructure.
interesting_facts: Treasuremap serves as the central collection of reference architecture
  manifests for Airship.
get_started: Use airshipctl to process the Treasuremap YAML documents and deploy your
  infrastructure.
