project_name: Airship
summary: Airship is a collection of components that declaratively configure, deploy,
  and maintain a Kubernetes environment defined by YAML documents.
key_features:
- Declarative deployment and management of Kubernetes environments.
- Configuration entirely driven by YAML documents.
- Integration with OpenStack and other cloud-native technologies for bare metal provisioning
  and lifecycle management.
recent_updates: Airship has evolved to version 2, incorporating CAPI (Cluster API)
  and moving towards a more modular, cloud-native architecture for declarative infrastructure
  management.
use_cases: Managing lifecycle of bare-metal infrastructure and Kubernetes clusters,
  deploying 5G networks and edge computing infrastructure, declarative, reproducible
  infrastructure deployments in enterprise data centers.
interesting_facts: Airship is supported by the Open Infrastructure Foundation (formerly
  OpenStack Foundation) and was notably used by AT&T to deploy its 5G network infrastructure.
get_started: Visit the official documentation at https://docs.airshipit.org/ to learn
  how to deploy an Airship environment using the Treasuremap repository as a reference
  architecture.
related_tools:
- Kubernetes
- OpenStack
- Cluster API (CAPI)
- Helm
