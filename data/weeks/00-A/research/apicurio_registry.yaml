summary: A CNCF sandbox schema and API registry providing centralized management, storage, and evolution tracking for schemas and API contracts.
key_features:
- 'Comprehensive format support: OpenAPI, AsyncAPI, Avro, Protobuf, JSON Schema, GraphQL.'
- Schema validation and compatibility rules preventing breaking changes in event streams.
- Pluggable storage backends (PostgreSQL, Kafka Streams, In-Memory).
- Integration with Kafka client serializers/deserializers (SerDes).
recent_updates: Apicurio Registry 3.0 modernized UI and decoupled storage connector architecture.
use_cases: Managing schema evolution in event-driven Kafka architectures and governing enterprise API contracts.
ecosystem_perspectives:
  strengths: High performance and strong cloud native integration for Apicurio Registry.
  considerations: Requires architectural evaluation and cluster operational planning.
  community_discussions:
  - Active discussions across the cloud native community regarding Apicurio Registry adoption.
interesting_facts: Apicurio Registry is widely utilized across the cloud native and open source ecosystem.
get_started: 'Run via Docker: `docker run -it -p 8080:8080 apicurio/apicurio-registry-mem:latest`.'
