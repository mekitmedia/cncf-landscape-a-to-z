project_name: "Akri"
summary: "Akri (A Kubernetes Resource Interface for the Edge) is a Cloud Native Computing Foundation (CNCF) Sandbox project that easily exposes heterogeneous leaf devices—such as IP cameras, USB sensors, and OPC UA equipment—as resources in a Kubernetes cluster."
key_features:
  - "Automated discovery of IoT edge devices (ONVIF, udev, OPC UA, etc.)"
  - "Exposes devices as Kubernetes Custom Resources (CRDs)"
  - "Extends the Kubernetes device plugin framework for the edge"
  - "Schedules workloads automatically on nodes where devices are detected"
  - "Supports high availability and device failover"
recent_updates: "Akri continues to grow its ecosystem of discovery handlers, enabling support for a wider array of industrial and edge protocols, and it remains an active CNCF Sandbox project."
use_cases: "Simplifying edge computing deployments by automating the connection of cameras in retail, sensors in warehouses, and OPC UA equipment in industrial environments to Kubernetes clusters."
interesting_facts: "Akri means 'edge' in Greek and acts as an acronym for 'A Kubernetes Resource Interface.' It was originally created by Microsoft to make Kubernetes a viable edge computing solution. Perspectives vary on its complexity, with some engineers highlighting how it drastically reduces the manual effort of maintaining dynamic hardware configurations (e.g. automatically recovering workloads when devices fail over), while others point out a steep learning curve related to writing custom discovery handlers for proprietary edge protocols."
get_started: "Install Akri using its Helm charts (`helm install akri akri-helm-charts/akri`), apply an Akri Configuration (like ONVIF or udev) to your cluster, and deploy pods requesting those resources. See documentation at https://project-akri.github.io/akri/ and learn more about real-world discovery setups at https://oneuptime.com/blog/post/2026-02-09-akri-iot-device-discovery/view."
related_tools:
  - "K3s"
  - "MicroK8s"
  - "KubeEdge"
