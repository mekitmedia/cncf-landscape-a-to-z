project_name: "Apache Avro"
homepage_url: "https://avro.apache.org/"
repo_url: "https://github.com/apache/avro"
cncf_status: "non-cncf"
summary: "Apache Avro is a data serialization system that provides rich data structures, a compact, fast, binary data format, and simple integration with dynamic languages."
key_features:
  - "Rich data structures defined using JSON."
  - "Compact, fast, binary data format."
  - "Container file format for storing persistent data."
  - "Remote procedure call (RPC)."
  - "Simple integration with dynamic languages with no code generation required to read or write data files."
latest_release:
  version: "release-1.12.2"
  date: "2026-08-23"
  url: "https://github.com/apache/avro/releases/tag/release-1.12.2"
recent_updates: "The 1.12.2 release includes a broad round of hardening against malformed and adversarial input across the Java and Python SDKs, plus security fixes in C#, C++, and JavaScript."
use_cases: "Often used as the leading serialization format for record data and the first choice for streaming data pipelines, commonly integrating with Apache Hadoop and Apache Kafka."
interesting_facts: "Avro relies on schemas that are always present when data is read, permitting data to be written with no per-value overheads, making serialization both fast and small."
get_started: "Get started by defining a schema in JSON format, then generate code or dynamically (de)serialize data using one of the many supported language SDKs (Java, Python, C++, etc)."
docs_url: "https://avro.apache.org/docs/"
related_tools:
  - "Apache Hadoop"
  - "Apache Kafka"
  - "Apache Thrift"
