project_name: "Apache Avro"
homepage_url: "https://avro.apache.org/"
repo_url: "https://github.com/apache/avro"
cncf_status: "non-cncf"
summary: "Apache Avro is a data serialization system."
key_features:
  - "Rich data structures"
  - "A compact, fast, binary data format"
  - "A container file, to store persistent data"
  - "Remote procedure call (RPC)"
  - "Simple integration with dynamic languages"
latest_release:
  version: "1.12.0"
  date: "2024-08-05"
  url: "https://github.com/apache/avro/releases/tag/release-1.12.0"
recent_updates: "Continued improvements in serialization performance and multi-language support (Java, Python, C++, etc.)."
use_cases: "Leading serialization format for record data, and a first choice for streaming data pipelines, particularly within the Hadoop and Kafka ecosystems."
interesting_facts: "Avro relies heavily on schemas which are defined using JSON. Unlike Protocol Buffers or Thrift, Avro does not require code generation for data processing."
get_started: "Check out the official getting started guide for your language of choice at https://avro.apache.org/docs/1.12.0/getting-started-java"
docs_url: "https://avro.apache.org/docs/"
related_tools:
