project_name: "Agola"
homepage_url: "https://agola.io"
repo_url: "https://github.com/agola-io/agola"
cncf_status: "non-cncf"
summary: "Agola is an open source CI/CD platform that provides containerized and reproducible workflows called Runs, designed for high availability and distributed execution."
key_features:
  - "Containerized, reproducible and restartable Runs"
  - "Advanced workflows supporting matrix builds, fan-in, fan-out, and multi-arch execution"
  - "Integration with multiple git sources like GitHub, GitLab, and Gitea"
  - "Execution on multiple platforms including Kubernetes, Docker, IaaS, and bare metal"
  - "Users Direct Runs allowing test runs from a local git repository without committing"
latest_release:
  version: "v0.11.0"
  date: "2025-09-25"
  url: "https://github.com/agola-io/agola/releases/tag/v0.11.0"
recent_updates: "Release v0.11.0 included gateway multiplexing simplification, dependency updates, migration to Go 1.25, update to golangci-lint, and fixes to CSRF, config validation, and various detailed error messages."
use_cases: "Continuous integration and delivery of software projects, testing local changes against a remote Agola server with user direct runs, and handling complex workflows like matrix builds across multiple architectures."
opinions: "While some users praise Agola for its User Direct Runs feature and clean architecture for orchestrating Kubernetes pods, others note that its documentation can sometimes lag behind feature development and that the community is smaller compared to industry giants like ArgoCD or Jenkins."
interesting_facts: "Agola allows 'User Direct Runs' where developers can execute a run directly from their local codebase without needing to push to a remote git repository, significantly speeding up testing."
get_started: "Users can try Agola out quickly following their getting started guide to define a run and push their project, triggering a reproducible CI/CD pipeline."
docs_url: "https://agola.io/doc/"
related_tools:
  - "Argo CD"
  - "Tekton"
  - "Jenkins"
