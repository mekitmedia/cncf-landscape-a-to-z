summary: A cloud-native CI/CD system designed to run workflows across multiple execution environments including Kubernetes, containers, and virtual machines.
key_features:
- Container-native workflow execution in Kubernetes pods.
- User-driven pipelines configured via YAML manifests.
- Multi-source authentication (GitHub, GitLab, Gitea).
- Distributed microservices architecture.
recent_updates: Enhanced token security and modern Kubernetes executor integrations.
use_cases: Building flexible internal CI/CD pipelines running inside isolated Kubernetes pods.
ecosystem_perspectives:
  strengths: Lightweight and completely Kubernetes-native without vendor lock-in.
  considerations: Requires architectural evaluation and cluster operational planning.
  community_discussions:
  - Active discussions across the cloud native community regarding Agola adoption.
interesting_facts: Agola is widely utilized across the cloud native and open source ecosystem.
get_started: Deploy Agola on Kubernetes via Helm charts and trigger builds with the `agola` CLI.
