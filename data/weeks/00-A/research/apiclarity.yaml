project_name: "APIClarity"
summary: "APIClarity is a cloud API observability open-source project that discovers and monitors API traffic, reporting suspected security weaknesses or possible abuses. It operates by capturing all API traffic or actively testing endpoints, and can automatically reconstruct OpenAPI specifications when none are available."
key_features:
  - "OpenAPI automatic reconstruction based on observed API traffic"
  - "Spec Diffs module to identify Shadow APIs, Zombie APIs, and specification deviations"
  - "Trace Analyzer module to discover weak authentications, sensitive data leaks, and BOLA risks"
  - "BFLA Detector to capture authorization models and identify Broken Function Level Authorization"
  - "Fuzzer module to actively test API endpoints based on specifications"
  - "Supports integrations with Istio Service Mesh, Kong, Tyk, Tap via DaemonSet, and OpenTelemetry"
recent_updates: "The project repository was archived by the owner on May 29, 2026, and is now read-only."
use_cases: "Used by DevOps and DevSecOps teams to monitor modern applications for zombie APIs, shadow APIs, data injection risks, and various authorization vulnerabilities in Kubernetes environments."
interesting_facts: "Developed by Cisco (openclarity), APIClarity offers a modular architecture that supports a wide range of external traffic sources including Apigee X Gateway and BIG-IP LTM Load balancers."
get_started: "Install APIClarity in a Kubernetes cluster using Helm: `helm repo add apiclarity https://openclarity.github.io/apiclarity` followed by `helm install --values values.yaml --create-namespace apiclarity apiclarity/apiclarity -n apiclarity`."
related_tools:
  - "Istio"
  - "Kong"
  - "Tyk"
  - "OpenTelemetry"
  - "Aserto"
