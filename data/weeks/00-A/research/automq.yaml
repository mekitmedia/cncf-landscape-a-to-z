project_name: "AutoMQ"
homepage_url: "https://www.automq.com"
repo_url: "https://github.com/AutoMQ/automq"
cncf_status: "non-cncf"
summary: "AutoMQ is a cloud-native, diskless Kafka alternative built on S3, providing high cost-effectiveness and single-digit millisecond latency while maintaining 100% compatibility with the Apache Kafka protocol."
key_features:
  - "Shared Storage architecture utilizing object storage like S3"
  - "Stateless and diskless design for instant elasticity"
  - "Zero cross-AZ fees and multi-AZ availability"
  - "100% compatibility with Apache Kafka protocol"
  - "Kafka Linking for fully managed cross-cluster data synchronization"
latest_release:
  version: "1.7.4"
  date: "2024-08-29"
  url: "https://github.com/AutoMQ/automq/releases/tag/1.7.4"
recent_updates: "Release 1.7.4 added support for direct local writes in zerozone and preserved confirm offset metadata on append ack."
use_cases: "Replacing traditional Apache Kafka for cloud deployments to reduce storage and cross-AZ traffic costs, and dynamically scaling streaming data infrastructure."
interesting_facts: "According to articles from AWS Storage Blog and the AutoMQ team, AutoMQ redesigns Kafka for the cloud era by replacing local disk storage with an S3Stream repository. This setup is reported to achieve up to 90% savings in cross-AZ traffic costs compared to Apache Kafka."
get_started: "Visit the documentation at https://docs.automq.com/ to learn how to deploy AutoMQ on your cloud provider."
docs_url: "https://docs.automq.com/"
related_tools:
  - "Apache Kafka"
sources:
