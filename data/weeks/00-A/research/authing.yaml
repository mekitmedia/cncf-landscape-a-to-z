project_name: Authing
homepage_url: https://www.authing.cn
repo_url: https://github.com/Authing/Authing
cncf_status: non-cncf
summary: Authing is a developer-centric, API-First, full-scene (B2C/B2B/B2E) identity
  cloud and IAM (Identity and Access Management) solution.
key_features:
- Multi-factor authentication (MFA)
- API-First design
- Universal Directory (Guard) and embeddable login form
- Custom Database Connections
- SSO (Single Sign-On)
latest_release:
  version: v1.15
  date: '2021-12-30'
  url: https://github.com/Authing/Authing/releases/tag/v1.15
recent_updates: Recent updates focus on multitenancy, application integration (e.g.
  MeterSphere, Redash, OpenVPN) and synchronization center enhancements.
use_cases: Providing unified login experiences for SaaS platforms, managing enterprise
  workforce access, and securing digital identities.
interesting_facts: Authing was included in the Forbes Asia 100 to Watch list and was
  selected as an Innovative Enterprise in Domestic Identity Management and Access
  Control in China. Reviews and community discussions often highlight Authing as the
  'Auth0 or Okta for the Chinese market' emphasizing its extensive API-First identity
  cloud approach and its focus on solving both B2C and B2E identity challenges.
get_started: To get started, developers can use the SDK or Authing Guard universal
  component to quickly launch a secure, customizable UI unified login form.
docs_url: https://docs.authing.cn
related_tools:
- Auth0
- Keycloak
- Dex
