project_name: "Apache AGE"
homepage_url: "https://age.apache.org/"
repo_url: "https://github.com/apache/age"
cncf_status: "non-cncf"
summary: "Apache AGE is a PostgreSQL Graph database extension that leverages graph data structures to analyze and use relationships and patterns in data. It adds graph data processing and analytics capability to relational databases."
key_features:
  - "Provides graph database functionality as a PostgreSQL extension."
  - "Read and write graph data in nodes and edges within an existing relational database."
  - "Supports variable length and edge traversal algorithms."
  - "Uses its own set of SQL extensions, similar to Cypher, while allowing native SQL queries."
latest_release:
  version: "Release v1.5.0 for PG16"
  date: "2024-01-08"
  url: "https://github.com/apache/age/releases/tag/PG16/v1.5.0-rc0"
recent_updates: "Compatible with PostgreSQL 16."
use_cases: "Useful for those who want to leverage the flexibility of graph databases while maintaining PostgreSQL's advanced SQL querying capabilities and robust transaction support."
interesting_facts: "AGE stands for A Graph Extension. It transforms a standard relational PostgreSQL database into a powerful graph database without the need for a separate data store."
get_started: "Install as a PostgreSQL extension and begin modeling data as nodes and edges following the tutorial at https://age.apache.org/age-manual/master/intro/setup.html."
docs_url: "https://age.apache.org/age-manual/master/intro/overview.html"
related_tools:
  - "PostgreSQL"
  - "Neo4j"
sources:
  - label: "Official Website"
    url: "https://age.apache.org/"
  - label: "GitHub Repository"
    url: "https://github.com/apache/age"
  - label: "ASF Project Spotlight"
