summary: An open-source Kubernetes distribution based on the exact builds and security patches used by Amazon Web Services in Amazon EKS.
key_features:
- Reproducible, secure builds of upstream Kubernetes components.
- Includes kube-apiserver, controller-manager, scheduler, kubelet, and etcd.
- Extended security maintenance and backported CVE patches.
- Signed container images on Amazon ECR Public Gallery.
recent_updates: Regular monthly security releases tracking upstream Kubernetes patch cycles.
use_cases: Self-managed Kubernetes clusters on EC2 or on-premise hardware requiring AWS-tested stability.
ecosystem_perspectives:
  strengths: High performance and strong cloud native integration for Amazon Elastic Kubernetes Service Distro (Amazon EKS-D).
  considerations: Requires architectural evaluation and cluster operational planning.
  community_discussions:
  - Active discussions across the cloud native community regarding Amazon Elastic Kubernetes Service Distro (Amazon EKS-D) adoption.
interesting_facts: Amazon Elastic Kubernetes Service Distro (Amazon EKS-D) is widely utilized across the cloud native and open source ecosystem.
get_started: Pull EKS-D container images from public ECR or deploy via `kops` or `eksctl anywhere`.
related_tools:
- Amazon EKS Anywhere
- kOps
- Kubernetes
