project_name: Influxdb
homepage_url: https://influxdata.com
repo_url: https://github.com/influxdata/influxdb
cncf_status: non-cncf
summary: InfluxDB is a scalable, open-source time series database designed for real-time events, analytics, and monitoring, powered by Apache Arrow, DataFusion, and Parquet.
key_features:
  - Diskless architecture with object storage support (or local disk with no dependencies)
  - Fast query response times (under 10ms for last-value queries, or 30ms for distinct metadata)
  - Embedded Python VM for plugins and triggers
  - Parquet file persistence
  - Compatibility with InfluxDB 1.x and 2.x write APIs
  - SQL query engine with support for FlightSQL and HTTP query API
recent_updates: "v3.12.1 brings faster startup after large file removals, a fix for catalog loading failures after upgrades, and ensures acknowledged writes are not lost after forced snapshots and restarts."
use_cases: "Monitoring sensor data, server monitoring, application performance monitoring, network monitoring, financial market and trading analytics, and behavioral analytics."
interesting_facts: "InfluxDB 3 Core utilizes a diskless architecture and is built using Rust, Apache Arrow, DataFusion, and persists data in Apache Parquet formats."
get_started: |
  Start InfluxDB using Docker:

  docker run -p 8086:8086 -v influxdb2:/var/lib/influxdb2 influxdb:2.0
related_tools:
  - Prometheus
  - Grafana
