  - id: source-1
    title: InfluxDB Release v3.12.1
    url: https://github.com/influxdata/influxdb/releases/tag/v3.12.1
    quotes:
      - "Faster startup after large file removals: At startup, the files that snapshots and checkpoints mark as removed are now dropped from each table's file list in one pass."
      - "Catalog failed to load after upgrading to v3.12.0: The server now loads a catalog in which a table has more than one field family with the same automatically generated name."
      - "Acknowledged writes lost after a forced snapshot and a restart: WAL flushes now run one at a time."
