project_name: "Inngest"
homepage_url: "https://www.inngest.com/"
repo_url: "https://github.com/inngest/inngest"
cncf_status: "non-cncf"
summary: "Inngest provides a workflow orchestration platform that replaces traditional queues and scheduling mechanisms, allowing developers to create reliable, durable step functions without managing infrastructure."
key_features:
  - "Provides developers the ability to execute robust background operations, ranging from simple tasks to intricate workflows."
  - "Utilizes Steps as core components to build dependable workflows capable of running for extended periods and bouncing back from errors."
  - "Features a multi-tenant queue system built for fair distribution, supporting various flow control techniques such as throttling, debouncing, and rate limiting."
recent_updates: "The most recent tag is `v1.46.0`, released in October 2026. Sandbox creation supports selecting stored secrets and injecting them."
use_cases: "Useful for developers needing to execute dependable background tasks, from basic jobs to intricate workflows."
interesting_facts: "The server and CLI tools are distributed under the Server Side Public License and a delayed open source publication model under Apache 2.0."
get_started: "The Dev Server can be run to provide a comprehensive local development environment that mirrors production."
related_tools:
  - "Temporal"
  - "Apache Airflow"
  - "Prefect"
sources:
  - id: "source-0"
    title: "Inngest GitHub README"
    url: "https://raw.githubusercontent.com/inngest/inngest/main/README.md"
    quotes:
      - "Inngest's durable functions replace queues, state management, and scheduling to enable any developer to write reliable step functions faster without touching infrastructure."
      - "Inngest Functions enable developers to run reliable background logic, from background jobs to complex workflows."
      - "Steps are fundamental building blocks of Inngest, turning your Inngest Functions into reliable workflows that can run for months and recover from failures."
      - "A multi-tenant aware, multi-tier queue designed for fairness and various flow control methods"
      - "The Inngest server and CLI are available under the Server Side Public License and delayed open source publication (DOSP) under Apache 2.0."
      - "Run the [**Inngest Dev Server**](#getting-started) for a complete local development experience, with production parity."
