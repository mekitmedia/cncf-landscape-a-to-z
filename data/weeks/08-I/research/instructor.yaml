project_name: "Instructor"
homepage_url: "https://python.useinstructor.com/"
repo_url: "https://github.com/567-labs/instructor"
cncf_status: "non-cncf"
summary: "Instructor is a library for structured extraction, getting reliable JSON from any LLM, built on Pydantic for validation, type safety, and IDE support."
key_features:
  - "Provides automatic validation, retries, streaming, and nested object support without manual schema writing."
  - "Works with every major provider including OpenAI, Anthropic, Google, and local models like Ollama using the same API."
  - "Stream partial objects as they're generated."
  - "Automatically retries failed validations with the error message."
recent_updates: "The most recent tag is v1.17.0."
use_cases: "Extract complex, nested data structures from natural language with automatic validation and retries, streamlining structured data extraction."
interesting_facts: "Instructor is trusted by over 100,000 developers, has over 3 million monthly downloads, and is used by teams at OpenAI, Google, Microsoft, and AWS."
get_started: "Install Instructor via pip `pip install instructor`, define a Pydantic model for your data, and use `instructor.from_provider()` to extract structured data from any LLM."
related_tools:
  - "LangChain"
  - "LlamaIndex"
  - "PydanticAI"
