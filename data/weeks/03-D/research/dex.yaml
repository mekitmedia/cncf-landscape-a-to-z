  url: https://github.com/dexidp/dex
  source_type: github_readme
  quotes:
  - Dex is an identity service that uses [OpenID Connect][openid-connect] to drive
    authentication for other apps.
  - Dex acts as a portal to other identity providers through ["connectors."](#connectors)
    This lets dex defer authentication to LDAP servers, SAML providers, or established
    identity providers like GitHub, Google, and Active Directory.
cncf_status: sandbox
