project_name: Dgraph
homepage_url: https://dgraph.io/
repo_url: https://github.com/dgraph-io/dgraph
summary: Dgraph is an open-source, distributed graph database with native GraphQL
  support designed for high throughput, low latency, and ACID transactions.
key_features:
- Horizontally scalable distributed graph architecture with native GraphQL API support.
- ACID transactions, consistent replication using Raft, and linearizable distributed
  reads.
- Disk layout optimized for graph traversals to minimize I/O seeks and network hops.
recent_updates: Version 25 introduces performance optimizations for large-scale graph
  traversals and simplified cluster clustering.
use_cases: Real-time recommendation engines, knowledge graph query backends, and fraud
  detection platforms.
