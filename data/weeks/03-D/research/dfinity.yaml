project_name: Dfinity
homepage_url: https://dfinity.org/
repo_url: https://github.com/dfinity/ic
summary: Dfinity develops the Internet Computer Protocol (ICP), a decentralized cloud
  platform running sovereign WebAssembly canisters at web speed.
key_features:
- Decentralized cloud network executing tamper-proof WebAssembly smart contracts (canisters).
- Runs directly at web speed with unbounded sub-second consensus scaling.
- Enables end-to-end decentralized hosting of web services without traditional cloud
  providers.
recent_updates: Recent protocol releases deliver 64-bit Wasm heap limit expansions
  and enhanced cross-canister messaging throughput.
use_cases: Hosting decentralized web applications, sovereign backend microservices,
  and tamper-proof computational canisters.
