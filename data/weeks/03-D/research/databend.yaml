project_name: Databend
homepage_url: https://databend.rs
repo_url: https://github.com/datafuselabs/databend
summary: Databend is an open-source, Rust-powered cloud data warehouse engineered
  for lightning-fast analytics, search, and AI agent workloads.
key_features:
- Modern columnar storage with complete separation of storage and compute.
- Unified SQL engine handling structured analytics, full-text search, and AI vector
  data.
- Native object storage integration (S3, GCS, Azure Blob) with built-in cache acceleration.
recent_updates: Latest v1.2 releases deliver enhanced vector search indexing and an
  isolated Python execution sandbox.
use_cases: Real-time analytics, AI agent knowledge retrieval, and cost-effective cloud
  data warehousing.
