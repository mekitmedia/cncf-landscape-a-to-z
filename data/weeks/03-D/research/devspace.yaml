project_name: "DevSpace"
homepage_url: "https://devspace.sh"
repo_url: "https://github.com/devspace-sh/devspace"
cncf_status: "sandbox"
summary: "DevSpace is an open-source command-line tool that provides everything you need to develop, deploy and debug applications with Docker and Kubernetes. It lets you streamline deployment workflows and share them with your colleagues through a declarative configuration file devspace.yaml."
key_features:
  - "Build, test and debug applications directly inside Kubernetes"
  - "Develop with hot reloading: updates your running containers without rebuilding images or restarting containers"
  - "Unify deployment workflows within your team and across dev, staging and production"
  - "Automate repetitive tasks for image building and deployment"
recent_updates: ""
use_cases: "Standardize & Version Your Workflows, Let Everyone on Your Team Deploy to Kubernetes, Speed Up Cloud-Native Development, Automate Repetitive Tasks"
interesting_facts: "DevSpace runs as a single binary CLI tool directly on your computer and does not require a server-side component as it communicates directly to your Kubernetes cluster using your kube-context, just like kubectl."
get_started: "See https://devspace.sh/docs/getting-started/installation"
related_tools: []
