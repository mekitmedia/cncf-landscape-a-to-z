project_name: Druid
homepage_url: https://druid.apache.org/
repo_url: https://github.com/apache/druid
summary: Apache Druid is a distributed, real-time analytical database designed for
  rapid sub-second ad-hoc queries over high-concurrency streaming event streams.
key_features:
- Native streaming ingestion directly from Apache Kafka and Amazon Kinesis with exactly-once
  guarantees.
- Columnar storage with automated bitmap indexing and dictionary encoding.
- Sub-second query responses under thousands of concurrent user queries.
recent_updates: Version 39.0 brings multi-stage query (MSQ) engine enhancements and
  improved window function support.
use_cases: Clickstream analytics, real-time APM telemetry dashboards, and digital
  advertising reporting.
