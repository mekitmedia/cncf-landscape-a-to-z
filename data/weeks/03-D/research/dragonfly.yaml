project_name: Dragonfly
homepage_url: https://d7y.io/
repo_url: https://github.com/dragonflyoss/dragonfly
summary: Dragonfly is a CNCF graduated peer-to-peer (P2P) image and file distribution
  system that eliminates registry bottlenecks across massive Kubernetes clusters.
key_features:
- P2P-powered distribution eliminating bandwidth saturation on central image registries.
- Non-invasive proxy mode compatible with standard container runtimes (containerd,
  CRI-O).
- Nydus image acceleration support for instant OCI container startup without pulling
  entire images.
recent_updates: Recent v2.5 releases bring optimized chunk scheduling algorithms and
  enhanced enterprise peer security.
use_cases: Accelerating container image distribution in massive multi-thousand node
  clusters and distributed edge fleets.
