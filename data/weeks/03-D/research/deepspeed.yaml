project_name: DeepSpeed
homepage_url: https://github.com/microsoft/DeepSpeed
repo_url: https://github.com/microsoft/DeepSpeed
summary: DeepSpeed is Microsoft's distributed deep learning optimization library that
  pioneered memory optimizations to train and serve planet-scale models.
key_features:
- ZeRO (Zero Redundancy Optimizer) memory optimizations allowing massive parameter
  training on modest GPUs.
- Extreme-speed distributed training and high-throughput low-latency inference engines.
- Seamless integration with PyTorch, Hugging Face Transformers, and Ray clusters.
recent_updates: Introduced SuperOffload capabilities and low-precision master state
  optimizations for ultra-large model fine-tuning.
use_cases: Distributed pre-training and fine-tuning of multi-billion parameter LLMs
  across GPU clusters.
