project_name: Distr
homepage_url: https://distr.sh/
repo_url: https://github.com/distr-sh/distr
summary: Distr is an open-source platform designed for software vendors to distribute,
  license, and manage self-hosted and air-gapped on-premise deployments.
key_features:
- Standardized delivery and update engine for self-hosted software distributions.
- Support for Docker Compose quick-starts alongside enterprise Helm and air-gapped
  packages.
- Centralized customer instance licensing, telemetry, and automated update management.
recent_updates: Recent v4.10 releases bring enhanced air-gapped bundle packaging and
  customer licensing audit logs.
use_cases: Vendor delivery of on-premise enterprise software to customer-managed Kubernetes
  clusters and VMs.
