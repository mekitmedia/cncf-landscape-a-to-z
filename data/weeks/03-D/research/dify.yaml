project_name: Dify
homepage_url: https://dify.ai/
repo_url: https://github.com/langgenius/dify
summary: Dify is a leading open-source LLM application development platform featuring
  visual AI agent workflows, prompt management, and high-performance RAG pipelines.
key_features:
- Visual canvas for designing multi-agent workflows, tool execution, and prompt logic.
- Built-in RAG pipeline with flexible document chunking, embedding, and hybrid retrieval.
- Unified model management supporting hundreds of proprietary and open-weights LLMs.
- Integrated enterprise observability with Opik, Langfuse, and Arize Phoenix integrations.
recent_updates: Version 1.20+ expands complex agentic orchestration nodes and multi-tenant
  enterprise access controls.
use_cases: Building enterprise AI assistants, complex multi-step agentic workflows,
  and internal document search engines.
