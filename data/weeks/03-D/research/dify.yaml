  - Dify is an open-source LLM app development platform. Its intuitive interface combines
    AI workflow, RAG pipeline, agent capabilities, model management, observability
    features (including [Opik](https://www.comet.com/docs/opik/integrations/dify),
    [Langfuse](https://docs.langfuse.com), and [Arize Phoenix](https://docs.arize.com/phoenix))
