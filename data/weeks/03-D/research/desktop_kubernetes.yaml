  quotes:
  - '_Desktop Kubernetes_ is a Linux Bash CLI that provisions a Kubernetes cluster
    right on your desktop using KVM or VirtualBox - with each cluster node consisting
    of a guest VM running any of: Alma, CentOS, or Rocky Linux.'
