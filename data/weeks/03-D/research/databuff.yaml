project_name: DataBuff
homepage_url: https://databuff.ai/
repo_url: https://github.com/databufflabs/databuff
summary: DataBuff is an AI-native Application Performance Monitoring (APM) backend
  engineered for OpenTelemetry telemetry ingestion and multi-agent systems.
key_features:
- Direct ingestion of OpenTelemetry traces, metrics, and logs via native OTLP/gRPC/HTTP.
- Architected specifically as an APM backend optimized for the AI era and multi-agent
  workloads.
- Automated anomaly correlation across distributed services and database calls.
recent_updates: Recent releases add improved OTLP collector throughput and multi-agent
  trace visualization.
use_cases: Observability for distributed microservices, multi-agent LLM systems, and
  enterprise OpenTelemetry telemetry.
