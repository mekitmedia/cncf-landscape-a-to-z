project_name: Dalec
homepage_url: https://project-dalec.github.io/dalec/
repo_url: https://github.com/project-dalec/dalec
summary: Dalec is a declarative package and container build system that focuses on
  software supply chain security.
key_features:
- Declarative format for building system packages and containers.
- Designed with a strong focus on software supply chain security.
- Enables reproducible package compilation across multiple targets.
