  source_type: github_readme
  quotes:
  - '**DeepEval** is a simple-to-use, open-source LLM evaluation framework, for evaluating
    large-language model systems. It is similar to Pytest but specialized for unit
    testing LLM apps.'
  - Whether you're building AI agents, voice agents, multi-turn chatbots, RAG pipelines,
    or anything else, implemented via LangChain or OpenAI, DeepEval has you covered.
