project_name: DragonflyDB
homepage_url: https://dragonflydb.io/
repo_url: https://github.com/dragonflydb/dragonfly
summary: DragonflyDB is a modern, multi-threaded in-memory data store engineered in
  C++ as a high-throughput drop-in replacement for Redis and Memcached.
key_features:
- Full wire-protocol compatibility with Redis and Memcached APIs.
- Modern multi-threaded shared-nothing architecture built on Linux io_uring.
- Up to 25x higher throughput and 30% lower memory footprint on identical server hardware.
recent_updates: Version 2.1 delivers improved snapshotting speed and extended Redis
  7 command set compatibility.
use_cases: High-throughput session caching, real-time gaming leaderboards, and sub-millisecond
  LLM prompt caching.
