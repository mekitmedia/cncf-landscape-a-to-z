project_name: "Direktiv"
homepage_url: "https://www.direktiv.io/"
repo_url: "https://github.com/direktiv/direktiv"
cncf_status: "non-cncf"
summary: "Direktiv is a cloud-agnostic, serverless flow engine that capitalizes on microservices, containers and custom code to create efficient processes."
key_features:
  - "Event-driven system and container approach for linking different systems."
  - "YAML-based flow description system to easily customize flows and expand capabilities."
  - "Acts as a broker for multiple backends with error handling, retries, logging and tracing capabilities."
recent_updates: "Release direktiv-0.10.0 includes the direktiv helm chart."
use_cases: "Useful for event-driven serverless orchestration, integration of multiple backends, and automation of repetitive tasks like continuous integration or infrastructure management."
interesting_facts: "Uses Kubernetes and Knative under the hood to provide the scalability of modern cloud computing."
get_started: "Build a local development cluster using task: `brew install go-task` followed by `task default`."
related_tools:
  - "Serverless"
  - "Argo"
  - "Knative"
