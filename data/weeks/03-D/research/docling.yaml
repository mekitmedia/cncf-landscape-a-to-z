project_name: Docling
homepage_url: https://www.docling.ai/
repo_url: https://github.com/docling-project/docling
summary: Docling is an open-source document parsing library created by IBM Research
  that converts PDFs, DOCX, and tables into clean markdown for generative AI and RAG.
key_features:
- Advanced PDF layout analysis, reading order reconstruction, and complex table structure
  recovery.
- Exports structured documents directly to Markdown and JSON optimized for LLM chunking.
- Native integration with LlamaIndex, LangChain, and vector embedding pipelines.
recent_updates: Recent releases add OCR acceleration, scanned document enhancements,
  and multimodal chart understanding.
use_cases: Preprocessing complex business documents, research papers, and spreadsheets
  for LLM RAG pipelines.
