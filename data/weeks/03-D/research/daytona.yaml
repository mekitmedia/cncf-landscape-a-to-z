project_name: Daytona
homepage_url: https://www.daytona.io
repo_url: https://github.com/daytonaio/daytona
summary: Daytona is a standardized development environment manager and infrastructure
  framework originally created for managing developer workspaces and running AI code.
key_features:
- Standardized cloud development environments provisioned with single-command CLI.
- Infrastructure sandboxing designed for running AI-generated code securely.
- Multi-cloud and local provider integrations for rapid workspace spin-up.
recent_updates: In June 2026, Daytona core development transitioned to a private codebase
  while the v0.190 codebase remains public under open license.
use_cases: Self-hosted cloud development environments and automated sandboxes for
  executing untrusted AI code.
