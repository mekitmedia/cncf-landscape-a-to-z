project_name: DatenLord
homepage_url: https://datenlord.github.io/
repo_url: https://github.com/datenlord/datenlord
summary: DatenLord is a high-performance cloud-native distributed storage system designed
  to deliver extreme IOPS and low latency for cloud applications.
key_features:
- Distributed POSIX file system built with Rust and modern hardware acceleration.
- Designed to meet high-performance and large capacity demands in cloud-native environments.
- Direct support for Kubernetes container storage via CSI drivers.
recent_updates: Enhanced distributed metadata caching and lock-free concurrency optimizations.
use_cases: High-throughput cloud storage for distributed machine learning training
  and stateful Kubernetes workloads.
