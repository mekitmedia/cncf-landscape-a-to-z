project_name: "Quarkus"
homepage_url: "https://www.quarkus.io/"
repo_url: "https://github.com/quarkusio/quarkus"
cncf_status: "non-cncf"
summary: "Quarkus is a Cloud Native, (Linux) Container First framework for writing Java applications tailored for Kubernetes and cloud environments."
key_features:
  - "Container First: Minimal footprint Java applications optimal for running in containers."
  - "Cloud Native: Embraces 12 factor architecture in environments like Kubernetes."
  - "Versatile: Designed to scale from the smallest microservice to the largest monolith."
  - "Fast startup: Shifts work to build time, resulting in incredibly fast startup times."
  - "JVM and native: Provides JVM execution for high throughput or native execution for constrained environments."
  - "Unify imperative and reactive: Brings non-blocking and imperative development styles under one programming model."
  - "Standards-based: Based on popular standards and frameworks like RESTEasy, Hibernate ORM, Netty, Vert.x, and MicroProfile."
  - "Developer Joy: Delivers a development-centric experience with rapid live reload and tooling."
recent_updates: "Release 3.40.1.1 includes bump for rest-assured to version 6.3.0 and other dependency updates."
use_cases: "Building highly efficient, minimal-footprint microservices, serverless functions, and cloud-native Java applications running in Kubernetes."
interesting_facts: "Quarkus achieves its 'Supersonic Subatomic' characteristics by aggressively doing work at build-time (AOT compilation) that traditional frameworks do at runtime."
get_started: "Check out the official documentation at quarkus.io to generate a new project and view the contribution guide."
related_tools: []
sources:
  - id: "github_readme"
    url: "https://github.com/quarkusio/quarkus"
    quotes:
      - "Quarkus is a Cloud Native, (Linux) Container First framework for writing Java applications."
      - "Container First:\nMinimal footprint Java applications optimal for running in containers."
      - "Cloud Native:\nEmbraces [12 factor architecture](https://12factor.net) in environments like Kubernetes."
      - "Versatile:\nFrom the smallest microservice to the largest monolith."
      - "Fast startup:\nWe do more at build time, we start fast."
      - "Unify imperative and reactive:\nBrings under one programming model non-blocking and imperative styles of development."
      - "Standards-based:\nBased on the standards and frameworks you love and use (RESTEasy and JAX-RS, Hibernate ORM and JPA, Netty, Eclipse Vert.x, Eclipse MicroProfile, Apache Camel...)."
      - "Developer Joy:\nDevelopment centric experience without compromise to bring your amazing apps to life in no time."
