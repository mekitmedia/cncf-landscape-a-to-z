project_name: "Open Application Model"
summary: "OAM is a standard yet higher level abstraction for modeling cloud native applications on top of today's hybrid and multi-cloud environments, focusing on the application rather than the infrastructure."
key_features:
  - "Application first - define the app deployment with a self-contained model, where operational behaviors as part of app definition, free of infrastructure, simply deploy."
  - "Clarity and extensibility - an open standard to modularize app delivery into reusable pieces, assemble them into a deployment plan per your own needs, fully self-service."
  - "Vendor agnostic - a consistent yet higher level abstraction to model app delivery across on-prem clusters, cloud providers or even edge devices. Zero lock-in."
recent_updates: ""
use_cases: "Modeling cloud native applications on top of hybrid and multi-cloud environments, and defining application deployment with a higher level API."
interesting_facts: "The design of Open Application Model is driven by KubeVela project - a modern application deployment platform."
get_started: ""
related_tools: []
