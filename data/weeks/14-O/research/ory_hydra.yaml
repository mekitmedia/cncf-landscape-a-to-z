cncf_status: "non-cncf"
summary: "Ory Hydra provides a scalable OAuth 2.0 and OpenID Connect server designed for high throughput, low latency, and absolute control over UI flows via a custom login and consent app."
key_features:
  - "OAuth 2.0 and OpenID Connect flows"
  - "Token issuance and validation"
  - "Client management"
  - "Consent and login flow orchestration"
  - "JWKS management"
  - "Low latency and high throughput"
recent_updates: "v26.2.0 with bug fixes including retry curl invocations to surmount transient third-party failures, broken older down migrations, and context passing."
use_cases: "OAuth2 and OpenID Connect for single sign on, API access, and machine to machine authorization"
interesting_facts: "Ory Hydra implements Open Standards set by the IETF"
get_started: "Install the Ory CLI if you do not have it yet"
related_tools:
  - "Ory Kratos"
  - "Ory Oathkeeper"
  - "Ory Keto"
