project_name: OpenFeature
homepage_url: https://openfeature.dev/
repo_url: https://github.com/open-feature/spec
cncf_status: incubating
summary: OpenFeature is an open specification that provides a vendor-agnostic, community-driven
  API for feature flagging that works with your favorite feature flag management tool
  or in-house solution.
key_features:
- Provides a unified API and SDK for feature flag evaluation across popular technology
  stacks.
- Vendor-agnostic and language-agnostic.
- Simple, understandable APIs with low/no dependency and extensibility.
recent_updates: An up-to-date SDK compatibility overview can be found on openfeature.dev/docs/reference/sdks/sdk-compatibility.
use_cases: Organizations looking to standardize their feature flagging implementation
  across different teams, languages, and tools.
interesting_facts: The specification complies with RFC 2119 and seeks to conform to
  the W3C QA Framework Guidelines. Some basic tooling (donated by Diego Hurtado) is
  employed to parse the specification and output a JSON structure.
get_started: To parse the specification, simply type 'make'. Please review the generated
  JSON files, which will appear as siblings to any of the markdown files in the /specification
  folder.
related_tools:
- Feature flag management tools
sources:
- id: readme
  url: https://github.com/open-feature/spec/blob/main/README.md
  quotes:
  - '[OpenFeature](https://openfeature.dev) is an open specification that provides
    a vendor-agnostic, community-driven API for feature flagging that works with your
    favorite feature flag management tool or in-house solution.'
  - The project aims to provide a unified API and SDK feature flag evaluation across
    popular technology stacks.
  - 'The OpenFeature specification must be designed with:


    - compatibility with existing feature flag offerings.

    - simple, understandable APIs.

    - vendor agnosticism.

    - language agnosticism.

    - low/no dependency.

    - extensibility.'
  - An up-to-date SDK compatibility overview can be found [here](https://openfeature.dev/docs/reference/sdks/sdk-compatibility).
  - This specification complies with [RFC 2119](https://datatracker.ietf.org/doc/html/rfc2119)
    and seeks to conform to the [W3C QA Framework Guidelines](https://www.w3.org/TR/qaframe-spec/).
  - In accordance with this, some basic tooling (donated graciously by [Diego Hurtado](https://github.com/ocelotl))
    has been employed to parse the specification and output a JSON structure of concise
    requirements
  - To parse the specification, simply type `make`.
