project_name: "KServe"
homepage_url: "https://kserve.github.io/website/"
repo_url: "https://github.com/kserve/kserve"
cncf_status: "incubating"
summary: "KServe is a standardized Distributed Generative and Predictive AI Inference Platform for scalable, multi-framework deployment on Kubernetes, unifying AI inference workloads."
key_features:
  - "Provides high-performance serving with GPU support and optimized memory management for large models."
  - "Supports multiple frameworks including TensorFlow, PyTorch, scikit-learn, XGBoost, ONNX, and more."
  - "Features intelligent request routing between predictor, transformer, and explainer components."
  - "Offers request-based autoscaling capabilities optimized for generative workload patterns with scale-to-zero support."
recent_updates: "The most recent tag is `v0.21.0`, released in September 2026."
use_cases: "KServe is ideal for high-scale, high-density and frequently-changing model serving use cases on Kubernetes."
interesting_facts: "KServe is an important addon component of Kubeflow, enabling standardized AI inference."
get_started: "Users can follow the quick installation guide to install KServe on their local machine or use Knative for serverless deployment."
related_tools:
  - "Kubeflow"
  - "TensorFlow"
  - "PyTorch"
