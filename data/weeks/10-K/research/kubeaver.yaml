cncf_status: non-cncf
summary: "Kubeaver is a tool for quickly deploying high-availability Kubernetes (K8s) clusters, supporting offline and online methods. The project is based on kubespray, leveraging Ansible to automate deployment tasks, and provides a user-friendly graphical user interface."
key_features:
  - "Cluster Management"
  - "Deploy Cluster (Offline Cluster Deployment)"
  - "Task Management"
  - "Task Time Statistics"
  - "Task Real-time Output"
  - "Node Management"
  - "Offline Package Management"
  - "Host Management"
recent_updates: ""
use_cases: "Quickly deploying high-availability Kubernetes clusters in offline or online environments."
interesting_facts: "Kubeaver is based on kubespray and leverages Ansible to automate deployment tasks. It is also a CNCF conformance-certified installer."
get_started: "tar xzvf kubeaver-offline-installer-1.0.0.tgz\n\ncd kubeaver-offline-installer-1.0.0\n\n./start.sh"
