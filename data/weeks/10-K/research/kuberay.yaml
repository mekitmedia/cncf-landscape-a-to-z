project_name: Kuberay
homepage_url: https://github.com/ray-project/kuberay
repo_url: https://github.com/ray-project/kuberay
cncf_status: non-cncf
summary: KubeRay is an open-source Kubernetes operator designed to streamline the deployment and management of Ray applications on Kubernetes, offering components like RayCluster, RayJob, and RayService.
key_features:
- '**RayCluster**: Fully manages the lifecycle of RayCluster, handling creation/deletion, autoscaling, and ensuring fault tolerance.'
- '**RayJob**: Automatically creates a RayCluster, submits a job upon cluster readiness, and can be configured to delete the cluster once the job concludes.'
- '**RayService**: Offers zero-downtime upgrades and high availability for RayCluster and Ray Serve deployment graphs.'
recent_updates: Starting from KubeRay v1.4.0, an experimental KubeRay Dashboard has been introduced to enable users to view and manage KubeRay resources.
use_cases: Simplifying the deployment, lifecycle management, autoscaling, and fault tolerance of distributed applications and machine learning workloads using Ray on Kubernetes.
interesting_facts: KubeRay provides a kubectl plugin (`kubectl ray`) starting from version 1.3.0 to simplify common workflows for deploying Ray on Kubernetes, catering to users less familiar with Kubernetes native commands.
get_started: Refer to the Quick Start guides in the Ray documentation for RayCluster, RayJob, and RayService to begin deploying workloads on Kubernetes using KubeRay.
related_tools:
- Kubernetes
- Ray
- Volcano
- Kueue
sources:
- id: readme
  url: https://github.com/ray-project/kuberay
  quotes:
  - KubeRay is a powerful, open-source Kubernetes operator that simplifies the deployment and management of [Ray](https://github.com/ray-project/ray) applications on Kubernetes.
  - '**RayCluster**: KubeRay fully manages the lifecycle of RayCluster, including cluster creation/deletion, autoscaling, and ensuring fault tolerance.'
  - '**RayJob**: With RayJob, KubeRay automatically creates a RayCluster and submits a job when the cluster is ready. You can also configure RayJob to automatically delete the RayCluster once the job finishes.'
  - '**RayService**: RayService is made up of two parts: a RayCluster and a Ray Serve deployment graph. RayService offers zero-downtime upgrades for RayCluster and high availability.'
  - '**Kubectl Plugin** (Beta): Starting from KubeRay v1.3.0, you can use the `kubectl ray` plugin to simplify

    common workflows when deploying Ray on Kubernetes.'
  - '**KubeRay Dashboard** (Experimental): Starting from KubeRay v1.4.0, we have introduced a new dashboard that enables users to view and manage KubeRay resources.'
  - KubeRay integrates with the Kubernetes ecosystem, including observability tools (e.g., Prometheus, Grafana, py-spy), queuing systems (e.g., Volcano, Apache YuniKorn, Kueue), ingress controllers (e.g., Nginx), and more.
