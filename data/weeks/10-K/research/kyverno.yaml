repo_url: https://github.com/kyverno/kyverno
cncf_status: graduated
summary: "Kyverno is a Kubernetes-native policy engine that validates, mutates, and generates resources using admission controls and background scans."
key_features:
  - "Kubernetes-native policy engine"
  - "Validate, mutate, generate, and clean up resources"
  - "Verify container image signatures for supply chain security"
  - "Operate with kubectl, kustomize, and Git"
recent_updates: "Kyverno v1.19.2 addresses 24 published GitHub Security Advisories, including script-injection hardening and API path validation."
use_cases: "Enforcing Pod Security Standards, validating container image signatures, auto-labeling workloads, and auto-injecting config maps or secrets."
interesting_facts: "Kyverno uses policy-as-code and does not replace Kubernetes built-in policy controls but complements them with features like comprehensive reporting."
get_started: "Kyverno installation and reference documentation is available at kyverno.io. You can start with the Quick Start guide or try it in the Kyverno Playground."
