project_name: "KubeEdge"
homepage_url: "https://kubeedge.io/en/"
repo_url: "https://github.com/kubeedge/kubeedge"
cncf_status: "graduated"
summary: "KubeEdge is a graduated CNCF project built upon Kubernetes that extends native containerized application orchestration and device management to hosts at the Edge. It consists of a cloud part and an edge part."
key_features:
  - "Kubernetes-native support for managing edge applications and devices with fully compatible APIs."
recent_updates: "v1.18 introduces Authorization Enhancement for CloudCore Websocket API."
use_cases: "Deploying complicated machine learning, image recognition, and event processing applications to the Edge where data is produced, improving responsiveness and data privacy."
interesting_facts: "KubeEdge is a graduation-level hosted project by the Cloud Native Computing Foundation (CNCF)."
get_started: "Get started with the official documentation at https://kubeedge.io/en/docs."
related_tools:
  - "CloudHub"
