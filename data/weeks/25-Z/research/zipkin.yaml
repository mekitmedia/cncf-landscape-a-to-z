project_name: "Zipkin"
homepage_url: "https://zipkin.io/"
repo_url: "https://github.com/openzipkin/zipkin"
cncf_status: "non-cncf"
summary: "A distributed tracing system that helps gather timing data needed to troubleshoot latency problems in service architectures."
key_features:
  - "Distributed tracing data collection and lookup"
  - "Visual representation of trace data and dependency graphs"
  - "Support for various storage backends including Cassandra, Elasticsearch, and MySQL"
  - "Instrumentation available for popular languages and frameworks"
latest_release:
  version: "3.6.1"
  date: "2026-04-08"
  url: "https://github.com/openzipkin/zipkin/releases/tag/3.6.1"
recent_updates: "Updates include bumping dependencies (like Netty and armeria) and improving Docker image availability."
use_cases: "Identifying latency bottlenecks, tracing requests across microservices, and visualizing service dependencies."
interesting_facts: "Zipkin was originally developed at Twitter, based on the Google Dapper paper, before becoming an open source project."
get_started: "Run Zipkin quickly using Docker: `docker run -d -p 9411:9411 openzipkin/zipkin` and start sending traces using provided instrumentation libraries."
docs_url: "https://zipkin.io/pages/documentation.html"
related_tools:
  - "Jaeger"
  - "OpenTelemetry"
  - "Prometheus"
