project_name: "Zenko"
homepage_url: "https://www.zenko.io"
repo_url: "https://github.com/scality/zenko"
cncf_status: "non-cncf"
summary: "An open-source multi-cloud data controller that provides a unified interface for storing, managing, and searching data across multiple cloud storage services and on-premises storage."
key_features:
  - "Multi-cloud storage backend support (AWS S3, Azure Blob, Google Cloud Storage, etc.)"
  - "Unified AWS S3 API for transparent data access across heterogeneous environments"
  - "Data management capabilities including replication, lifecycle management, and searching"
  - "Metadata search across stored objects, built on scalable backends"
latest_release:
  version: "2.15.5"
  date: "2026-07-31"
  url: "https://github.com/scality/Zenko/releases/tag/2.15.5"
recent_updates: "Updates to Zenko 2.15.x include Veeam SOSAPI capacity fixes, ZooKeeper tuning, and Kubernetes deployment enhancements."
use_cases: "Avoiding vendor lock-in by abstracting storage APIs, implementing hybrid cloud data replication, and unifying object storage management."
interesting_facts: "Zenko was developed by Scality and utilizes their robust internal metadata architecture to index multi-cloud objects efficiently."
get_started: "Zenko can be deployed on Kubernetes using Helm charts. A basic deployment provides an S3-compatible endpoint to manage underlying storage buckets."
docs_url: "https://documentation.scality.com/zenko/"
related_tools:
  - "MinIO"
  - "Rook"
  - "Ceph"
