project_name: "Zitadel"
homepage_url: "https://zitadel.com/"
repo_url: "https://github.com/zitadel/zitadel"
cncf_status: "non-cncf"
summary: "An open-source identity infrastructure built for the cloud, providing secure authentication, authorization, and user management."
key_features:
  - "Multi-tenancy support out-of-the-box, allowing complex B2B and B2C identity structures"
  - "Passwordless authentication and robust MFA options"
  - "Event-sourced architecture providing a complete audit trail of identity changes"
  - "OIDC and SAML 2.0 protocol support"
latest_release:
  version: "v4.17.3"
  date: "2026-09-04"
  url: "https://github.com/zitadel/zitadel/releases/tag/v4.17.3"
recent_updates: "Recent updates (v4.17.x) include cryptographic security enhancements for IDP tokens, improved authorization checks, and better UI translations."
use_cases: "Implementing secure login for SaaS platforms, managing decentralized identities across multiple organizations, and enforcing strict IAM policies."
interesting_facts: "Zitadel distinguishes itself by being deeply rooted in an event-sourcing paradigm, making its audit capabilities fundamentally different from traditional CRUD-based IAM solutions."
get_started: "Run Zitadel via Docker `docker run -p 8080:8080 ghcr.io/zitadel/zitadel:latest` and configure your first tenant via the local UI."
docs_url: "https://zitadel.com/docs"
related_tools:
  - "Keycloak"
  - "Auth0"
  - "Dex"
sources:
