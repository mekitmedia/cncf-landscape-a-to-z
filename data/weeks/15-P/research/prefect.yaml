project_name: Prefect
homepage_url: https://docs.prefect.io/
repo_url: https://github.com/PrefectHQ/prefect
cncf_status: non-cncf
summary: Prefect is a workflow orchestration framework for building resilient, dynamic data pipelines in Python, allowing teams to confidently automate data processes.
key_features:
  - Scheduling, caching, retries, and event-based automations
  - Prefect flow and task decorators
  - Self-hosted server or managed Prefect Cloud dashboard
recent_updates: Added Python 3.15 support, dropped Python 3.10 support, and deprecated Pendulum datetime behavior on Python 3.11-3.12.
use_cases: Building resilient data pipelines that react to the world around them and recover from unexpected changes, elevating simple Python scripts into production workflows.
interesting_facts: Prefect requires Python 3.11+ and provides simple Python decorators to orchestrate and observe your workflow.
get_started: |
  Prefect requires Python 3.11+. To install the latest version, run:

  pip install -U prefect

  Then create and run a Python file that uses Prefect `flow` and `task` decorators.
related_tools:
  - Apache Airflow
  - Dagster
  - Luigi
