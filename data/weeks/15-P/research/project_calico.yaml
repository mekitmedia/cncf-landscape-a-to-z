project_name: "Project Calico"
homepage_url: "https://www.tigera.io/project-calico"
repo_url: "https://github.com/projectcalico/calico"
cncf_status: "non-cncf"
summary: "Project Calico is an open-source solution for container networking and security, created and maintained by Tigera. It is widely adopted and powers over 8 million nodes daily."
key_features:
  - "Data Plane Choice: Offers eBPF, standard Linux, Windows, and VPP."
  - "Interoperability: Works across multiple distros, clouds, bare metal, and VMs."
  - "Optimized Performance: High speed and low CPU usage."
  - "Advanced Security: Granular access controls and WireGuard encryption."
  - "Flexible networking: Includes BGP, VXLAN, and service advertisement."
recent_updates: "Actively developed by Tigera and a community of over 200 contributors from global companies."
use_cases: "Container networking, network security, and advanced network policies for Kubernetes clusters across various environments."
interesting_facts: "Powers 8M+ nodes daily across 166 countries."
get_started: "Check out the quickstart guide for Kubernetes at the project's documentation site."
related_tools:
  - "Kubernetes"
  - "WireGuard"
sources:
  - id: 'readme'
    url: 'https://github.com/projectcalico/calico/blob/master/README.md'
    quotes:
      - "Project Calico, created and maintained by [Tigera][tigera], is an open-source project with an active development and user community. Calico Open Source has grown to be the most widely adopted solution for container networking and security, powering 8M+ nodes daily across 166 countries."
      - "- **Data Plane Choice**: eBPF, standard Linux, Windows, and VPP — versatility in network solutions."
      - "- **Interoperability**: Works across multiple distros, multiple clouds, bare metal, and VMs."
      - "- **Optimized Performance**: Engineered for high speed and low CPU usage, maximizing your cluster investments."
      - "- **Advanced Security**: Get granular access controls and WireGuard encryption."
      - "- **Flexible networking**: An array of networking tools at your disposal, including BGP, VXLAN, service advertisement, and more."
      - "- **Vibrant Contributor Community**: Over 200 contributors from a wide array of global companies."
