project_name: "Podman Container Tools"
homepage_url: "https://podman.io/"
repo_url: "https://github.com/podman-container-tools/podman"
cncf_status: "sandbox"
summary: "Podman is a tool used to manage OCI containers, images, volumes, and pods created from grouped containers."
key_features:
  - "Support for multiple container image formats, including OCI and Docker images."
  - "Full management of container lifecycle, including creation (both from an image and from an exploded root filesystem), running, checkpointing and restoring (via CRIU), and removal."
  - "Support for pods, groups of containers that share resources and are managed together."
  - "Support for running containers and pods without root or other elevated privileges."
  - "No manager daemon, for improved security and lower resource utilization at idle."
recent_updates: "v6.1.4 was released on 2026-10-12."
use_cases: "Running containers on Linux, Mac and Windows systems using a Podman-managed virtual machine; managing container images and volumes; creating and managing pods."
interesting_facts: "Podman is based on libpod, a library for container lifecycle management that is also contained in this repository. The libpod library provides APIs for managing containers, pods, container images, and volumes."
get_started: "Any recent Podman release should be able to run rootless without any additional configuration, though your operating system may require some additional configuration detailed in the [install guide](https://podman.io/getting-started/installation)."
related_tools:
  - "Buildah"
  - "Skopeo"
sources:
  - id: "source-0"
    title: "Podman Repository README"
    url: "https://raw.githubusercontent.com/podman-container-tools/podman/main/README.md"
    quotes:
      - "Podman (the POD MANager) is a tool for managing containers and images, volumes mounted into those containers, and pods made from groups of containers."
      - "Support for multiple container image formats, including OCI and Docker images."
      - "Full management of container lifecycle, including creation (both from an image and from an exploded root filesystem), running, checkpointing and restoring (via CRIU), and removal."
      - "Support for pods, groups of containers that share resources and are managed together."
      - "Support for running containers and pods without root or other elevated privileges."
      - "No manager daemon, for improved security and lower resource utilization at idle."
      - "Podman runs containers on Linux, but can also be used on Mac and Windows systems using a Podman-managed virtual machine."
      - "Podman is based on libpod, a library for container lifecycle management that is also contained in this repository. The libpod library provides APIs for managing containers, pods, container images, and volumes."
      - "Any recent Podman release should be able to run rootless without any additional configuration, though your operating system may require some additional configuration detailed in the [install guide](https://podman.io/getting-started/installation)."
      - "See [Skopeo](https://github.com/containers/skopeo/) for those tasks."
      - "Builds are supported via [Buildah](https://github.com/containers/buildah)."