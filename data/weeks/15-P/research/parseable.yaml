project_name: "Parseable"
homepage_url: "https://www.parseable.com"
repo_url: "https://github.com/parseablehq/parseable"
cncf_status: "non-cncf"
summary: "Parseable is an open source, columnar data lake platform purpose-built for observability."
key_features:
  - "Data lake architecture with stateless compute over object storage"
  - "Fully featured with alerting, dashboards, anomaly detection, and APM in a single binary"
  - "Agent ready with support for both AI agents and LLMs"
  - "OpenTelemetry native with no custom plugins required"
recent_updates: "Added process CPU limit metric, aborted hot-tier tasks on tenant deletion, added checklist to home API, fixed failed alert evaluation, added tool executer API for external MCP server, and exposed read-only tools."
use_cases: "Sending logs, metrics, and traces via popular logging agents, OpenTelemetry, Kafka, eBPF, or other integrations, and utilizing native observability features like PromQL & SQL within a single binary."
interesting_facts: "Parseable operates as a single binary, providing a fully featured observability platform without needing to stitch together multiple tools."
get_started: |
  Download and run the Parseable binary on your laptop:

  ```bash
  curl -fsSL https://logg.ing/install | bash
  ```
related_tools:
  - OpenTelemetry
  - Kafka
sources:
