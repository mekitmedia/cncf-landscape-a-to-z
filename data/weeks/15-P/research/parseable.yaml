    title: Parseable GitHub Repository
    url: https://github.com/parseablehq/parseable
    quotes:
      - "Parseable is an open source, columnar data lake platform - purpose built for observability."
      - "Stateless compute over object storage as the backing store. Storage and compute scale independently, so you're not paying for one to grow the other."
      - "Parseable is feature complete with alerting, dashboards, anomaly detection, APM, and more, all from a single binary without stitching together multiple tools."
      - "Whether you need to observe your AI agents or use LLMs to analyze your telemetry data, Parseable supports both natively."
      - "With native OTel support, you can send telemetry data to Parseable without any custom modifications or plugins."
      - "Send logs, metrics & traces to Parseable via popular logging agents, OpenTelemetry, Kafka, eBPF or other integrations. Use native observability features like alerting, dashboards, anomaly detection, APM, PromQL & SQL - all within a single binary."
      - "Download and run the Parseable binary on your laptop:"
