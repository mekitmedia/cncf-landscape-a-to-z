summary: "Paralus is a free, open source tool that enables controlled, audited access to Kubernetes infrastructure for your users, user groups, and services."
key_features:
  - "Creation of custom roles, users, and groups."
  - "Dynamic and immediate changing and revoking of permissions."
  - "Ability to control access via pre-configured roles across clusters, namespaces, projects, and more."
  - "Seamless integration with Identity Providers (IdPs) allowing the use of external authentication engines for users and group definitions, such as GitHub, Google, Azure AD, Okta, and others."
  - "Automatic logging of all user actions performed for audit and compliance purposes."
  - "Interact with Paralus either with a modern web GUI (default), a CLI tool called pctl, or Paralus API."
recent_updates: "Latest release is v0.3.0 published on 2026-01-16."
use_cases: "Paralus can be easily integrated with your pre-existing RBAC configuration and your SSO providers, or Identity Providers (IdP) that support OIDC (OpenID Connect). Through just-in-time service account creation and fine-grained user credential management, Paralus provides teams with an adaptable system for guaranteeing secure access to resources when necessary, along with the ability to rapidly identify and respond to threats through dynamic permission revocation and real time audit logs."
interesting_facts: "Installing and setting up Paralus takes less time than it takes to brew a (good) cup of coffee!"
get_started: "You'll find the instructions here: [Docs](https://www.paralus.io/docs/) and [Installation](https://www.paralus.io/docs/Installation/)"
