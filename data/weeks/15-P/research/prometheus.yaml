project_name: "Prometheus"
homepage_url: "https://prometheus.io/"
repo_url: "https://github.com/prometheus/prometheus"
cncf_status: "graduated"
summary: "Prometheus is a cloud-native systems and service monitoring system that collects metrics, evaluates rule expressions, and can trigger alerts."
key_features:
  - "A multi-dimensional data model (time series defined by metric name and set of key/value dimensions)"
  - "PromQL, a powerful and flexible query language to leverage this dimensionality"
  - "No dependency on distributed storage; single server nodes are autonomous"
  - "An HTTP pull model for time series collection"
  - "Pushing time series is supported via an intermediary gateway for batch jobs"
  - "Targets are discovered via service discovery or static configuration"
  - "Multiple modes of graphing and dashboarding support"
  - "Support for hierarchical and horizontal federation"
recent_updates: ""
use_cases: ""
interesting_facts: ""
get_started: "docker run --name prometheus -d -p 127.0.0.1:9090:9090 prom/prometheus"
related_tools: []
sources:
  - id: "readme"
    url: "https://raw.githubusercontent.com/prometheus/prometheus/main/README.md"
    quotes:
      - "Prometheus, a [Cloud Native Computing Foundation](https://cncf.io/) project, is a systems and service monitoring system."
      - "It collects metrics\nfrom configured targets at given intervals, evaluates rule expressions,\ndisplays the results, and can trigger alerts when specified conditions are observed."
      - "* A **multi-dimensional** data model (time series defined by metric name and set of key/value dimensions)"
      - "* PromQL, a **powerful and flexible query language** to leverage this dimensionality"
      - "* No dependency on distributed storage; **single server nodes are autonomous**"
      - "* An HTTP **pull model** for time series collection"
      - "* **Pushing time series** is supported via an intermediary gateway for batch jobs"
      - "* Targets are discovered via **service discovery** or **static configuration**"
      - "* Multiple modes of **graphing and dashboarding support**"
      - "* Support for hierarchical and horizontal **federation**"
      - "docker run --name prometheus -d -p 127.0.0.1:9090:9090 prom/prometheus"
