cncf_status: "non-cncf"
summary: "Gravitee API Management (also called Gravitee APIM) is a flexible, lightweight, and blazing-fast Open Source solution that helps your organization control who, when, and how users access your APIs. Effortlessly manage the lifecycle of your APIs."
key_features:
  - "Create and register APIs in a few clicks to easily expose your secured APIs to internal and external consumers."
  - "Provides over 50 pre-built policies to effectively shape traffic reaching the gateway according to your business requirements."
  - "Build the portal that your developers want with a custom theme, full-text search, and API documentation."
  - "The out-of-the-box dashboards give you a 360-degree view of your API."
recent_updates: "The most recent version tag is `4.12.21`, released in October 2026."
use_cases: "Effortlessly manage the lifecycle of your APIs, control who, when, and how users access them, and document, discover, and publish APIs."
interesting_facts: "Gravitee.io provides advanced dynamic client registration to link API Management and Access Management effectively."
get_started: "Different ways to start using Gravitee APIM include Gravitee Cloud, Helm Chart, and docker-compose / make."
related_tools:
  - "Kong"
  - "Tyk"
  - "KrakenD"
