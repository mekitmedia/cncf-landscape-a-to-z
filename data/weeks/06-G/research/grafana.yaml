project_name: "Grafana"
homepage_url: "https://grafana.com"
repo_url: "https://github.com/grafana/grafana"
cncf_status: "non-cncf"
summary: "An open-source observability and data visualization platform that allows users to monitor metrics, logs, and traces from a wide range of disparate data sources."
key_features:
  - "Extensive visualization options using customizable client-side graphs and panel plugins"
  - "Dynamic dashboards powered by template variables"
  - "Interactive data exploration with ad-hoc querying and time range comparisons"
  - "Seamless transition between metrics and logs while preserving label context"
  - "Visual alerting engine with notifications for external systems like Slack and PagerDuty"
  - "Ability to combine multiple different data sources within a single graph"
recent_updates: "Version 13.2.4 includes security fixes and alerting enhancements, including CVE remediation and stripping sensitive headers from oauth2 cross-host redirects."
use_cases: "Visualizing logs, metrics, and traces, creating dynamic monitoring dashboards, analyzing telemetry data, and setting up alerting."
interesting_facts: "Users can evaluate the platform online via a live interactive sandbox environment before performing local installation."
get_started: "Visit the official download page to get the binaries or follow the installation guides."
